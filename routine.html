}
</script>
<script>
// ================= ROUTINE =================
const RT_STORAGE_KEY = 'routineDashboardData_v1';
const RT_ALL_DAYS = [0,1,2,3,4,5,6];
const DOW_SHORT = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const DOW_TINY  = ['S','M','T','W','T','F','S'];

let activeTab = 'routine';
let rtSubView = 'today';
let rtEditMode = false;
let rtViewDate = todayStr();
let rtRange = 'weekly';
let rtEditingBlockId = null;
let rtEditingBlockDraft = null;

function rtSeed(){
  return {
    groups:[{id:'gm',name:'Morning'},{id:'gd',name:'Day'},{id:'ge',name:'Evening'}],
    blocks:[
      {id:'wake', name:'Wake up',              groupId:'gm', type:'time',     target:'06:30', days:RT_ALL_DAYS.slice(), role:'wake'},
      {id:'meds', name:'Medication + protein', groupId:'gm', type:'check',                    days:RT_ALL_DAYS.slice()},
      {id:'wkt',  name:'Workout',              groupId:'gm', type:'check',                    days:RT_ALL_DAYS.slice(), link:'workout'},
      {id:'shwr', name:'Shower + facial',      groupId:'gm', type:'check',                    days:RT_ALL_DAYS.slice()},
      {id:'jrnl', name:'Coffee + journaling',  groupId:'gm', type:'note',                     days:RT_ALL_DAYS.slice(), prompt:'A line about today…'},
      {id:'book', name:'Book or podcast',      groupId:'gd', type:'note',                     days:RT_ALL_DAYS.slice(), prompt:'What did you read or listen to?'},
      {id:'walk', name:'Meditation + walk',    groupId:'gd', type:'duration', target:20,      days:RT_ALL_DAYS.slice()},
      {id:'med2', name:'Meditation',           groupId:'ge', type:'duration', target:10,      days:RT_ALL_DAYS.slice()},
      {id:'bed',  name:'Bed time',             groupId:'ge', type:'time',     target:'23:00', days:RT_ALL_DAYS.slice(), role:'bed'}
    ],
    logs:{}
  };
}

function rtNormalize(data){
  if(!data || typeof data!=='object') return rtSeed();
  if(!Array.isArray(data.groups) || !data.groups.length) data.groups=[{id:'gm',name:'Morning'}];
  if(!Array.isArray(data.blocks)) data.blocks=[];
  if(!data.logs || typeof data.logs!=='object') data.logs={};
  const groupIds = new Set(data.groups.map(g=>g.id));
  data.blocks.forEach(b=>{
    if(!Array.isArray(b.days) || !b.days.length) b.days = RT_ALL_DAYS.slice();
    if(!groupIds.has(b.groupId)) b.groupId = data.groups[0].id;
    if(!b.type) b.type='check';
  });
  return data;
}

function rtLoad(){
  try{ const raw=localStorage.getItem(RT_STORAGE_KEY); if(raw) return rtNormalize(JSON.parse(raw)); }
  catch(e){ console.error('routine load failed', e); }
  return rtSeed();
}
let rtState = rtLoad();

function rtSaveLocal(){ localStorage.setItem(RT_STORAGE_KEY, JSON.stringify(rtState)); }
function rtSave(){ rtState.updatedAt=Date.now(); rtSaveLocal(); cloudQueueSaveRoutine(); }

// ---------- helpers ----------
function rtShiftDate(dateStr, days){
  const d=new Date(dateStr+'T00:00:00'); d.setDate(d.getDate()+days); return localDateStr(d);
}
function rtDow(dateStr){ return new Date(dateStr+'T00:00:00').getDay(); }
function rtActiveBlocks(includePaused){
  return rtState.blocks.filter(b=>!b.deleted && (includePaused || !b.paused));
}
function rtScheduled(b, dateStr){ return (b.days||RT_ALL_DAYS).indexOf(rtDow(dateStr))!==-1; }
function rtEntry(dateStr, id){ const day=rtState.logs[dateStr]; return (day && day[id]) || null; }
function rtSetEntry(dateStr, id, patch){
  if(!rtState.logs[dateStr]) rtState.logs[dateStr]={};
  const cur = rtState.logs[dateStr][id] || {};
  rtState.logs[dateStr][id] = Object.assign(cur, patch);
  rtSave();
}
function rtIsSkipped(dateStr, id){ const e=rtEntry(dateStr,id); return !!(e && e.skipped); }
function workoutLoggedOn(dateStr){
  return state.plans.some(p=>p.cards.some(c=> c.logs && c.logs[dateStr]));
}
function workoutNameOn(dateStr){
  for(const p of state.plans) for(const c of p.cards) if(c.logs && c.logs[dateStr]) return c.name;
  return null;
}
function rtIsDone(b, dateStr){
  if(b.link==='workout') return workoutLoggedOn(dateStr);
  const e=rtEntry(dateStr,b.id);
  if(!e || e.skipped) return false;
  if(b.type==='time')     return !!e.time;
  if(b.type==='duration') return (e.minutes||0)>0;
  if(b.type==='note')     return !!e.done || !!(e.note && e.note.trim());
  return !!e.done;
}
function rtDayStats(dateStr){
  let done=0,total=0;
  rtActiveBlocks(false).forEach(b=>{
    if(!rtScheduled(b,dateStr)) return;
    if(rtIsSkipped(dateStr,b.id)) return;
    total++; if(rtIsDone(b,dateStr)) done++;
  });
  return {done,total};
}
function rtMinutesFromTime(t){ const p=(t||'').split(':'); return p.length===2 ? (+p[0])*60+(+p[1]) : null; }
function rtFmtMinutes(m){
  m=Math.round(m); const h=Math.floor(m/60), mm=m%60;
  return h+':'+String(mm).padStart(2,'0');
}
function rtFmtDuration(m){
  m=Math.round(m); const h=Math.floor(m/60), mm=m%60;
  return h+'h '+String(mm).padStart(2,'0');
}
function rtSleepMinutes(dateStr){
  const wakeB = rtState.blocks.find(b=>b.role==='wake');
  const bedB  = rtState.blocks.find(b=>b.role==='bed');
  if(!wakeB || !bedB) return null;
  const wake = rtEntry(dateStr, wakeB.id);
  const bed  = rtEntry(rtShiftDate(dateStr,-1), bedB.id);
  if(!wake || !wake.time || !bed || !bed.time) return null;
  let bedMin = rtMinutesFromTime(bed.time);
  const wakeMin = rtMinutesFromTime(wake.time);
  if(bedMin===null || wakeMin===null) return null;
  if(bedMin < 720) bedMin += 1440;
  const sleep = (wakeMin + 1440) - bedMin;
  return (sleep>0 && sleep<=16*60) ? sleep : null;
}

// ---------- tabs ----------
function switchTab(name){
  activeTab = name;
  document.getElementById('pane-routine').style.display = name==='routine' ? '' : 'none';
  document.getElementById('pane-workout').style.display = name==='workout' ? '' : 'none';
  document.getElementById('tab-btn-routine').classList.toggle('active', name==='routine');
  document.getElementById('tab-btn-workout').classList.toggle('active', name==='workout');
  if(name==='workout'){
    if(!state.plans.length) openCreateModal(); else renderAll();
  } else {
    renderRoutine();
  }
}
document.getElementById('tab-btn-routine').addEventListener('click', ()=>switchTab('routine'));
document.getElementById('tab-btn-workout').addEventListener('click', ()=>switchTab('workout'));

document.getElementById('rt-sub-today').addEventListener('click', ()=>{ rtSubView='today'; renderRoutine(); });
document.getElementById('rt-sub-stats').addEventListener('click', ()=>{ rtSubView='stats'; rtEditMode=false; renderRoutine(); });
document.getElementById('rt-edit-toggle').addEventListener('click', ()=>{ rtEditMode=!rtEditMode; rtSubView='today'; renderRoutine(); });
document.getElementById('rt-prev').addEventListener('click', ()=>{ rtViewDate=rtShiftDate(rtViewDate,-1); renderRoutine(); });
document.getElementById('rt-next').addEventListener('click', ()=>{ rtViewDate=rtShiftDate(rtViewDate,1); renderRoutine(); });
document.getElementById('rt-today-btn').addEventListener('click', ()=>{ rtViewDate=todayStr(); renderRoutine(); });
document.querySelectorAll('[data-range]').forEach(btn=>{
  btn.addEventListener('click', ()=>{ rtRange=btn.dataset.range; renderRoutine(); });
});

// ---------- reorder ----------
let rtDrag = null;
function rtMoveBefore(srcId, dstId){
  const blocks = rtState.blocks;
  const si = blocks.findIndex(b=>b.id===srcId);
  const di = blocks.findIndex(b=>b.id===dstId);
  if(si<0 || di<0 || si===di) return;
  const [src] = blocks.splice(si,1);
  const newDi = blocks.findIndex(b=>b.id===dstId);
  src.groupId = blocks[newDi].groupId;
  blocks.splice(newDi, 0, src);
  rtSave(); renderRoutine();
}
function rtMoveToGroupEnd(srcId, groupId){
  const blocks = rtState.blocks;
  const si = blocks.findIndex(b=>b.id===srcId);
  if(si<0) return;
  const [src] = blocks.splice(si,1);
  src.groupId = groupId;
  let lastIdx = -1;
  blocks.forEach((b,i)=>{ if(b.groupId===groupId) lastIdx=i; });
  blocks.splice(lastIdx+1, 0, src);
  rtSave(); renderRoutine();
}
function rtAttachDrag(handle, row, block){
  handle.addEventListener('pointerdown', e=>{
    e.preventDefault();
    try{ handle.setPointerCapture(e.pointerId); }catch(_){}
    rtDrag = {id:block.id, row};
    row.classList.add('dragging');
  });
  handle.addEventListener('pointermove', e=>{
    if(!rtDrag) return;
    document.querySelectorAll('.rt-row.drop-target').forEach(r=>r.classList.remove('drop-target'));
    const el = document.elementFromPoint(e.clientX, e.clientY);
    const target = el && el.closest ? el.closest('.rt-row') : null;
    if(target && target!==rtDrag.row) target.classList.add('drop-target');
  });
  const finish = e=>{
    if(!rtDrag) return;
    const el = document.elementFromPoint(e.clientX, e.clientY);
    const rowEl  = el && el.closest ? el.closest('.rt-row') : null;
    const listEl = el && el.closest ? el.closest('[data-group-list]') : null;
    row.classList.remove('dragging');
    document.querySelectorAll('.rt-row.drop-target').forEach(r=>r.classList.remove('drop-target'));
    const id = rtDrag.id; rtDrag = null;
    if(rowEl && rowEl.dataset.block && rowEl.dataset.block!==id) rtMoveBefore(id, rowEl.dataset.block);
    else if(listEl) rtMoveToGroupEnd(id, listEl.dataset.groupList);
  };
  handle.addEventListener('pointerup', finish);
  handle.addEventListener('pointercancel', ()=>{
    if(!rtDrag) return;
    row.classList.remove('dragging');
    document.querySelectorAll('.rt-row.drop-target').forEach(r=>r.classList.remove('drop-target'));
    rtDrag=null;
  });
}

// ---------- today view ----------
function rtMetricEl(k,v){
  const d=document.createElement('div'); d.className='rt-metric';
  d.innerHTML = `<div class="k">${escapeHtml(k)}</div><div class="v">${escapeHtml(v)}</div>`;
  return d;
}

function rtCurrentStreak(){
  let d = todayStr(), streak = 0;
  for(let i=0;i<400;i++){
    const s = rtDayStats(d);
    if(s.total>0 && s.done/s.total >= 0.8) streak++;
    else if(i>0 || s.done>0) break;
    d = rtShiftDate(d,-1);
  }
  return streak;
}

function renderRtMetrics(){
  const wrap=document.getElementById('rt-metrics');
  wrap.innerHTML='';
  const s = rtDayStats(rtViewDate);
  wrap.appendChild(rtMetricEl(rtViewDate===todayStr()?'Today':'That day', s.done+' / '+s.total));
  const sleep = rtSleepMinutes(rtViewDate);
  wrap.appendChild(rtMetricEl('Slept', sleep!==null ? rtFmtDuration(sleep) : '—'));
  let wDone=0,wTotal=0;
  for(let i=0;i<7;i++){ const st=rtDayStats(rtShiftDate(rtViewDate,-i)); wDone+=st.done; wTotal+=st.total; }
  wrap.appendChild(rtMetricEl('Last 7 days', wTotal? Math.round(wDone/wTotal*100)+'%' : '—'));
  wrap.appendChild(rtMetricEl('Streak', rtCurrentStreak()+' d'));
}

function rtStepper(value, step, onChange){
  const wrap=document.createElement('div'); wrap.className='stepper';
  const minus=document.createElement('button'); minus.type='button'; minus.textContent='−';
  const box=document.createElement('input'); box.type='text'; box.readOnly=true; box.value=value;
  const plus=document.createElement('button'); plus.type='button'; plus.textContent='+';
  let v=value;
  minus.addEventListener('click', ()=>{ v=Math.max(0, v-step); box.value=v; onChange(v); });
  plus.addEventListener('click',  ()=>{ v=v+step; box.value=v; onChange(v); });
  wrap.appendChild(minus); wrap.appendChild(box); wrap.appendChild(plus);
  return wrap;
}

function rtMakeRow(block){
  const date = rtViewDate;
  const row = document.createElement('div');
  row.className = 'rt-row';
  row.dataset.block = block.id;
  const skipped = rtIsSkipped(date, block.id);
  const done = rtIsDone(block, date);
  const scheduled = rtScheduled(block, date);
  if(skipped) row.classList.add('skipped');

  if(rtEditMode){
    const handle=document.createElement('i'); handle.className='ti ti-grip-vertical rt-handle'; handle.title='Drag to reorder';
    row.appendChild(handle);
    rtAttachDrag(handle, row, block);
  } else {
    const tick=document.createElement('button');
    tick.className='rt-tick'+(done?' done':'');
    tick.innerHTML=`<i class="ti ti-${done?'circle-check':'circle'}"></i>`;
    if(block.link==='workout'){
      tick.disabled=true; tick.title='Set by the workout tab';
    } else if(block.type==='time' || block.type==='duration'){
      tick.disabled=true; tick.title='Fill in the value to complete';
    } else {
      tick.addEventListener('click', ()=>{ rtSetEntry(date, block.id, {done:!done, skipped:false}); renderRoutine(); });
    }
    row.appendChild(tick);
  }

  const main=document.createElement('div'); main.className='rt-main';
  const name=document.createElement('div'); name.className='rt-name'; name.textContent=block.name; name.title=block.name;
  main.appendChild(name);

  const subBits=[];
  if(rtEditMode){
    subBits.push(({check:'Check off',time:'Clock time',duration:'Duration',note:'Note'})[block.type]||block.type);
    if(block.days && block.days.length<7) subBits.push(block.days.slice().sort().map(d=>DOW_SHORT[d]).join(' '));
    if(block.paused) subBits.push('Paused');
  } else {
    if(block.type==='time' && block.target) subBits.push('target '+block.target);
    if(block.type==='duration' && block.target) subBits.push('target '+block.target+' min');
    if(!scheduled) subBits.push('not scheduled today');
    if(skipped) subBits.push('skipped');
  }
  if(subBits.length){
    const sub=document.createElement('div'); sub.className='rt-sub'; sub.textContent=subBits.join(' · ');
    main.appendChild(sub);
  }

  if(!rtEditMode && block.type==='note' && scheduled && !skipped){
    const e=rtEntry(date,block.id);
    const inp=document.createElement('input'); inp.type='text'; inp.className='rt-note';
    inp.placeholder = block.prompt || 'Add a note…';
    inp.value = (e && e.note) || '';
    inp.addEventListener('change', ()=>{ rtSetEntry(date, block.id, {note:inp.value}); renderRtMetrics(); });
    main.appendChild(inp);
  }
  row.appendChild(main);

  const ctrl=document.createElement('div'); ctrl.className='rt-ctrl';

  if(rtEditMode){
    const pencil=document.createElement('button'); pencil.className='rt-mini'; pencil.title='Edit block';
    pencil.innerHTML='<i class="ti ti-pencil" style="font-size:13px"></i>';
    pencil.addEventListener('click', ()=>rtOpenBlockEditor(block.id, null));
    ctrl.appendChild(pencil);
  } else if(!scheduled){
    const b=document.createElement('span'); b.className='rt-badge grey'; b.textContent='Off day'; ctrl.appendChild(b);
  } else if(skipped){
    const undo=document.createElement('button'); undo.className='rt-mini'; undo.title='Un-skip';
    undo.innerHTML='<i class="ti ti-arrow-back-up" style="font-size:13px"></i>';
    undo.addEventListener('click', ()=>{ rtSetEntry(date, block.id, {skipped:false}); renderRoutine(); });
    ctrl.appendChild(undo);
  } else {
    if(block.link==='workout'){
      const nm=workoutNameOn(date);
      const b=document.createElement('span'); b.className='rt-badge'+(nm?'':' grey'); b.textContent=nm?nm:'Not logged';
      ctrl.appendChild(b);
      const go=document.createElement('button'); go.className='rt-mini'; go.title='Open workout tab';
      go.innerHTML='<i class="ti ti-arrow-right" style="font-size:13px"></i>';
      go.addEventListener('click', ()=>switchTab('workout'));
      ctrl.appendChild(go);
    } else if(block.type==='time'){
      const e=rtEntry(date,block.id);
      const inp=document.createElement('input'); inp.type='time'; inp.value=(e && e.time)||'';
      inp.addEventListener('change', ()=>{ rtSetEntry(date, block.id, {time:inp.value, skipped:false}); renderRoutine(); });
      ctrl.appendChild(inp);
      const nowBtn=document.createElement('button'); nowBtn.className='rt-mini'; nowBtn.title='Stamp current time';
      nowBtn.innerHTML='<i class="ti ti-clock" style="font-size:13px"></i>';
      nowBtn.addEventListener('click', ()=>{
        const n=new Date();
        rtSetEntry(date, block.id, {time:String(n.getHours()).padStart(2,'0')+':'+String(n.getMinutes()).padStart(2,'0'), skipped:false});
        renderRoutine();
      });
      ctrl.appendChild(nowBtn);
    } else if(block.type==='duration'){
      const e=rtEntry(date,block.id);
      const cur=(e && e.minutes)||0;
      ctrl.appendChild(rtStepper(cur, 5, v=>{ rtSetEntry(date, block.id, {minutes:v, skipped:false}); renderRtMetrics(); }));
      const unit=document.createElement('span'); unit.className='rt-sub'; unit.style.margin='0'; unit.textContent='min';
      ctrl.appendChild(unit);
    }
    const skip=document.createElement('button'); skip.className='rt-mini'; skip.title='Skip today';
    skip.innerHTML='<i class="ti ti-ban" style="font-size:13px"></i>';
    skip.addEventListener('click', ()=>{ rtSetEntry(date, block.id, {skipped:true}); renderRoutine(); });
    ctrl.appendChild(skip);
  }
  row.appendChild(ctrl);
  return row;
}

function renderRtGroups(){
  const host=document.getElementById('rt-groups');
  host.innerHTML='';
  rtState.groups.forEach(group=>{
    const sec=document.createElement('div'); sec.className='rt-group'; sec.style.marginBottom='1rem';
    const hdr=document.createElement('div'); hdr.className='rt-group-hdr';
    if(rtEditMode){
      const inp=document.createElement('input'); inp.type='text'; inp.className='rt-group-name'; inp.value=group.name;
      inp.addEventListener('change', ()=>{ group.name=inp.value.trim()||'Group'; rtSave(); renderRoutine(); });
      hdr.appendChild(inp);
      const del=document.createElement('button'); del.className='rt-mini'; del.title='Delete group';
      del.innerHTML='<i class="ti ti-trash" style="font-size:12px"></i>';
      del.addEventListener('click', ()=>{
        const count=rtState.blocks.filter(b=>b.groupId===group.id && !b.deleted).length;
        if(count){ alert('Move or delete this group\u2019s blocks first.'); return; }
        if(rtState.groups.length<2){ alert('Keep at least one group.'); return; }
        rtState.groups=rtState.groups.filter(g=>g.id!==group.id); rtSave(); renderRoutine();
      });
      hdr.appendChild(del);
    } else {
      const lbl=document.createElement('span'); lbl.className='rt-group-name'; lbl.textContent=group.name;
      hdr.appendChild(lbl);
    }
    sec.appendChild(hdr);

    const list=document.createElement('div'); list.className='rt-list';
    list.dataset.groupList = group.id;
    const blocks = rtActiveBlocks(rtEditMode).filter(b=>b.groupId===group.id);
    if(!blocks.length){
      const empty=document.createElement('div'); empty.className='rt-row';
      empty.innerHTML='<span class="rt-sub" style="margin:0">Nothing here yet.</span>';
      list.appendChild(empty);
    } else {
      blocks.forEach(b=> list.appendChild(rtMakeRow(b)));
    }
    if(rtEditMode){
      const add=document.createElement('button'); add.className='rt-add-row';
      add.innerHTML='<i class="ti ti-plus" style="font-size:12px;vertical-align:-2px;margin-right:5px"></i>Add block';
      add.addEventListener('click', ()=>rtOpenBlockEditor(null, group.id));
      list.appendChild(add);
    }
    sec.appendChild(list);
    host.appendChild(sec);
  });
}

document.getElementById('rt-add-group').addEventListener('click', ()=>{
  const name=prompt('Group name');
  if(!name) return;
  rtState.groups.push({id:uid(), name:name.trim()});
  rtSave(); renderRoutine();
});

// ---------- block editor ----------
const rtBlockOverlay = document.getElementById('rt-block-overlay');
function rtSyncEditorFields(){
  const type=document.getElementById('rt-b-type').value;
  const wrap=document.getElementById('rt-b-target-wrap');
  const tTime=document.getElementById('rt-b-target-time');
  const tNum=document.getElementById('rt-b-target-num');
  const label=document.getElementById('rt-b-target-label');
  const hint=document.getElementById('rt-b-target-hint');
  const promptWrap=document.getElementById('rt-b-prompt-wrap');
  if(type==='time'){
    wrap.style.display=''; tTime.style.display=''; tNum.style.display='none';
    label.textContent='Target time'; hint.textContent='Shown next to the block. Wake and bed times also drive the sleep figure.';
  } else if(type==='duration'){
    wrap.style.display=''; tTime.style.display='none'; tNum.style.display='';
    label.textContent='Target minutes'; hint.textContent='Any value above zero counts the block as done.';
  } else {
    wrap.style.display='none';
  }
  promptWrap.style.display = type==='note' ? '' : 'none';
}
document.getElementById('rt-b-type').addEventListener('change', rtSyncEditorFields);

function rtRenderDayPills(days){
  const host=document.getElementById('rt-b-days');
  host.innerHTML='';
  DOW_TINY.forEach((lbl,i)=>{
    const b=document.createElement('button'); b.type='button';
    b.className='rt-daypill'+(days.indexOf(i)!==-1?' on':'');
    b.textContent=lbl;
    b.addEventListener('click', ()=>{
      const k=days.indexOf(i);
      if(k!==-1) days.splice(k,1); else days.push(i);
      rtRenderDayPills(days);
    });
    host.appendChild(b);
  });
}

function rtOpenBlockEditor(blockId, presetGroupId){
  rtEditingBlockId = blockId;
  const existing = blockId ? rtState.blocks.find(b=>b.id===blockId) : null;
  rtEditingBlockDraft = {
    days: existing ? (existing.days||RT_ALL_DAYS).slice() : RT_ALL_DAYS.slice()
  };
  document.getElementById('rt-block-title').textContent = existing ? 'Edit block' : 'Add block';
  document.getElementById('rt-b-name').value = existing ? existing.name : '';
  const groupSel=document.getElementById('rt-b-group');
  groupSel.innerHTML = rtState.groups.map(g=>`<option value="${g.id}">${escapeHtml(g.name)}</option>`).join('');
  groupSel.value = existing ? existing.groupId : (presetGroupId || rtState.groups[0].id);
  document.getElementById('rt-b-type').value = existing ? existing.type : 'check';
  document.getElementById('rt-b-target-time').value = existing && existing.type==='time' ? (existing.target||'') : '';
  document.getElementById('rt-b-target-num').value  = existing && existing.type==='duration' ? (existing.target||'') : '';
  document.getElementById('rt-b-prompt').value = existing ? (existing.prompt||'') : '';
  document.getElementById('rt-b-delete').style.display = existing ? '' : 'none';
  const pauseBtn=document.getElementById('rt-b-pause');
  pauseBtn.style.display = existing ? '' : 'none';
  pauseBtn.textContent = existing && existing.paused ? 'Resume' : 'Pause';
  rtSyncEditorFields();
  rtRenderDayPills(rtEditingBlockDraft.days);
  rtBlockOverlay.classList.add('open');
}
document.getElementById('rt-b-cancel').addEventListener('click', ()=>rtBlockOverlay.classList.remove('open'));
document.getElementById('rt-b-pause').addEventListener('click', ()=>{
  const b=rtState.blocks.find(x=>x.id===rtEditingBlockId);
  if(!b) return;
  b.paused=!b.paused; rtSave(); rtBlockOverlay.classList.remove('open'); renderRoutine();
});
document.getElementById('rt-b-delete').addEventListener('click', ()=>{
  const b=rtState.blocks.find(x=>x.id===rtEditingBlockId);
  if(!b) return;
  if(!confirm(`Delete "${b.name}"? Past entries stay in your history but the block disappears from the routine.`)) return;
  b.deleted=true; rtSave(); rtBlockOverlay.classList.remove('open'); renderRoutine();
});
document.getElementById('rt-b-save').addEventListener('click', ()=>{
  const name=document.getElementById('rt-b-name').value.trim();
  if(!name){ alert('Give the block a name.'); return; }
  const type=document.getElementById('rt-b-type').value;
  const groupId=document.getElementById('rt-b-group').value;
  const prompt=document.getElementById('rt-b-prompt').value.trim();
  let target;
  if(type==='time') target=document.getElementById('rt-b-target-time').value || '';
  else if(type==='duration') target=parseInt(document.getElementById('rt-b-target-num').value)||0;
  let days=rtEditingBlockDraft.days.slice().sort();
  if(!days.length) days=RT_ALL_DAYS.slice();

  if(rtEditingBlockId){
    const b=rtState.blocks.find(x=>x.id===rtEditingBlockId);
    const groupChanged = b.groupId!==groupId;
    b.name=name; b.type=type; b.groupId=groupId; b.days=days;
    b.target=target; b.prompt=prompt;
    if(groupChanged) rtMoveToGroupEnd(b.id, groupId);
  } else {
    const b={id:uid(), name, type, groupId, days, target, prompt};
    let lastIdx=-1;
    rtState.blocks.forEach((x,i)=>{ if(x.groupId===groupId) lastIdx=i; });
    rtState.blocks.splice(lastIdx+1, 0, b);
  }
  rtSave();
  rtBlockOverlay.classList.remove('open');
  renderRoutine();
});

// ---------- stats ----------
function rtBuckets(mode){
  const out=[];
  const today=new Date(); today.setHours(0,0,0,0);
  const push=(label,dates)=>out.push({label,dates});
  if(mode==='daily'){
    const span = window.innerWidth<640 ? 14 : 28;
    for(let i=span-1;i>=0;i--){
      const d=new Date(today.getTime()-i*86400000);
      push(String(d.getDate()), [localDateStr(d)]);
    }
  } else if(mode==='weekly'){
    const sun=new Date(today); sun.setDate(sun.getDate()-sun.getDay());
    for(let w=7;w>=0;w--){
      const ws=new Date(sun.getTime()-w*7*86400000);
      const dates=[];
      for(let k=0;k<7;k++){ const d=new Date(ws.getTime()+k*86400000); if(d<=today) dates.push(localDateStr(d)); }
      push((ws.getMonth()+1)+'/'+ws.getDate(), dates);
    }
  } else {
    for(let m=5;m>=0;m--){
      const first=new Date(today.getFullYear(), today.getMonth()-m, 1);
      const dim=new Date(first.getFullYear(), first.getMonth()+1, 0).getDate();
      const dates=[];
      for(let k=1;k<=dim;k++){ const d=new Date(first.getFullYear(), first.getMonth(), k); if(d<=today) dates.push(localDateStr(d)); }
      push(first.toLocaleDateString('en-US',{month:'short'}), dates);
    }
  }
  return out;
}
function rtBlockBucketValue(block, dates){
  let done=0, total=0;
  dates.forEach(d=>{
    if(!rtScheduled(block,d)) return;
    if(rtIsSkipped(d,block.id)) return;
    total++; if(rtIsDone(block,d)) done++;
  });
  return total ? done/total : null;
}
function rtCellStyle(v){
  if(v===null) return 'na';
  if(v===0) return 'zero';
  return '';
}

function renderRtStats(){
  const buckets = rtBuckets(rtRange);
  const blocks = rtActiveBlocks(false);
  const host = document.getElementById('rt-matrix');
  host.innerHTML='';
  document.querySelectorAll('[data-range]').forEach(b=>b.classList.toggle('on', b.dataset.range===rtRange));
  document.getElementById('rt-range-hint').textContent =
    rtRange==='daily' ? 'Last 28 days' : rtRange==='weekly' ? 'Last 8 weeks' : 'Last 6 months';

  const labelW = window.innerWidth<640 ? 92 : 150;
  const cols = `${labelW}px repeat(${buckets.length}, minmax(0,1fr)) 40px`;

  if(!blocks.length){
    host.innerHTML='<div class="empty-hint">Add a block on the Today tab to start tracking.</div>';
    return;
  }

  const totalRow=document.createElement('div');
  totalRow.className='rt-matrix'; totalRow.style.gridTemplateColumns=cols;
  totalRow.style.paddingBottom='6px'; totalRow.style.borderBottom='0.5px solid var(--bd)'; totalRow.style.marginBottom='8px';
  const tl=document.createElement('span'); tl.className='rt-mlabel total'; tl.textContent='All blocks';
  totalRow.appendChild(tl);
  let grandDone=0, grandTotal=0;
  buckets.forEach(bk=>{
    let d=0,t=0;
    blocks.forEach(b=>{
      bk.dates.forEach(dt=>{
        if(!rtScheduled(b,dt) || rtIsSkipped(dt,b.id)) return;
        t++; if(rtIsDone(b,dt)) d++;
      });
    });
    grandDone+=d; grandTotal+=t;
    const v = t ? d/t : null;
    const cell=document.createElement('div');
    cell.className='rt-cell '+rtCellStyle(v);
    if(v!==null && v>0) cell.style.opacity = (0.3+0.7*v).toFixed(2);
    cell.title = bk.label+' — '+(v===null?'nothing scheduled':Math.round(v*100)+'%');
    totalRow.appendChild(cell);
  });
  const tp=document.createElement('span'); tp.className='rt-mpct';
  tp.textContent = grandTotal ? Math.round(grandDone/grandTotal*100)+'%' : '—';
  totalRow.appendChild(tp);
  host.appendChild(totalRow);

  blocks.forEach(b=>{
    const row=document.createElement('div'); row.className='rt-matrix'; row.style.gridTemplateColumns=cols;
    const lbl=document.createElement('span'); lbl.className='rt-mlabel'; lbl.textContent=b.name; lbl.title=b.name;
    row.appendChild(lbl);
    let sd=0, st=0;
    buckets.forEach(bk=>{
      const v=rtBlockBucketValue(b, bk.dates);
      bk.dates.forEach(dt=>{
        if(!rtScheduled(b,dt) || rtIsSkipped(dt,b.id)) return;
        st++; if(rtIsDone(b,dt)) sd++;
      });
      const cell=document.createElement('div');
      cell.className='rt-cell '+rtCellStyle(v);
      if(v!==null && v>0) cell.style.opacity=(0.3+0.7*v).toFixed(2);
      cell.title = b.name+' · '+bk.label+' — '+(v===null?'not scheduled':Math.round(v*100)+'%');
      row.appendChild(cell);
    });
    const pct=document.createElement('span'); pct.className='rt-mpct';
    pct.textContent = st ? Math.round(sd/st*100)+'%' : '—';
    row.appendChild(pct);
    host.appendChild(row);
  });

  const axis=document.createElement('div'); axis.className='rt-matrix'; axis.style.gridTemplateColumns=cols; axis.style.marginTop='4px';
  axis.appendChild(document.createElement('span'));
  buckets.forEach((bk,i)=>{
    const s=document.createElement('span'); s.className='rt-axis';
    const every = rtRange==='daily' ? (window.innerWidth<640 ? 7 : 7) : 1;
    s.textContent = (i % every !== 0 && rtRange==='daily') ? '' : bk.label;
    axis.appendChild(s);
  });
  axis.appendChild(document.createElement('span'));
  host.appendChild(axis);

  renderRtStatMetrics();
  renderRtWeekday();
}

function renderRtStatMetrics(){
  const wrap=document.getElementById('rt-stat-metrics');
  wrap.innerHTML='';
  const buckets=rtBuckets(rtRange);
  const dates=[].concat(...buckets.map(b=>b.dates));
  let done=0,total=0;
  rtActiveBlocks(false).forEach(b=>dates.forEach(d=>{
    if(!rtScheduled(b,d) || rtIsSkipped(d,b.id)) return;
    total++; if(rtIsDone(b,d)) done++;
  }));
  wrap.appendChild(rtMetricEl('Overall', total?Math.round(done/total*100)+'%':'—'));

  const sleeps=dates.map(rtSleepMinutes).filter(v=>v!==null);
  wrap.appendChild(rtMetricEl('Avg sleep', sleeps.length?rtFmtDuration(sleeps.reduce((a,b)=>a+b,0)/sleeps.length):'—'));

  const wakeB=rtState.blocks.find(b=>b.role==='wake');
  let wakeLabel='Avg wake', wakeVal='—';
  if(wakeB){
    const mins=dates.map(d=>{const e=rtEntry(d,wakeB.id); return e&&e.time?rtMinutesFromTime(e.time):null;}).filter(v=>v!==null);
    if(mins.length){
      const avg=mins.reduce((a,b)=>a+b,0)/mins.length;
      const sd=Math.sqrt(mins.reduce((a,b)=>a+(b-avg)*(b-avg),0)/mins.length);
      wakeVal=rtFmtMinutes(avg);
      wakeLabel='Avg wake ±'+Math.round(sd)+'m';
    }
  }
  wrap.appendChild(rtMetricEl(wakeLabel, wakeVal));

  const wk=rtWeekdayRates(90);
  let worst=null;
  wk.forEach((r,i)=>{ if(r.total>=3 && (worst===null || r.done/r.total < wk[worst].done/wk[worst].total)) worst=i; });
  wrap.appendChild(rtMetricEl('Weakest day', worst===null?'—':DOW_SHORT[worst]));
}

function rtWeekdayRates(lookback){
  const out=DOW_SHORT.map(()=>({done:0,total:0}));
  let d=todayStr();
  for(let i=0;i<lookback;i++){
    const dow=rtDow(d);
    rtActiveBlocks(false).forEach(b=>{
      if(!rtScheduled(b,d) || rtIsSkipped(d,b.id)) return;
      out[dow].total++; if(rtIsDone(b,d)) out[dow].done++;
    });
    d=rtShiftDate(d,-1);
  }
  return out;
}

function renderRtWeekday(){
  const host=document.getElementById('rt-weekday');
  const rates=rtWeekdayRates(90);
  host.innerHTML='';
  rates.forEach((r,i)=>{
    const pct = r.total ? Math.round(r.done/r.total*100) : 0;
    const wrap=document.createElement('div');
    wrap.innerHTML = `<div class="prog-label"><span>${DOW_SHORT[i]}</span><span style="color:var(--tm)">${r.total?pct+'%':'—'}</span></div>
      <div class="prog-track"><div class="prog-fill" style="width:${pct}%"></div></div>`;
    host.appendChild(wrap);
  });
  const note=document.createElement('div'); note.className='hint';
  note.textContent='Last 90 days, across every scheduled block.';
  host.appendChild(note);
}

// ---------- routine render ----------
function renderRoutine(){
  const isToday = rtSubView==='today';
  document.getElementById('rt-today-view').style.display = isToday ? '' : 'none';
  document.getElementById('rt-stats-view').style.display = isToday ? 'none' : '';
  document.getElementById('rt-datenav').style.display = isToday ? '' : 'none';
  document.getElementById('rt-sub-today').classList.toggle('on', isToday);
  document.getElementById('rt-sub-stats').classList.toggle('on', !isToday);
  const editBtn=document.getElementById('rt-edit-toggle');
  editBtn.classList.toggle('on', rtEditMode);
  editBtn.innerHTML = rtEditMode
    ? '<i class="ti ti-check" style="font-size:12px;vertical-align:-2px;margin-right:4px"></i>Done'
    : '<i class="ti ti-pencil" style="font-size:12px;vertical-align:-2px;margin-right:4px"></i>Edit';
  document.getElementById('rt-add-group').style.display = (isToday && rtEditMode) ? '' : 'none';
  document.getElementById('rt-metrics').style.display = rtEditMode ? 'none' : '';

  const d=new Date(rtViewDate+'T00:00:00');
  let label=d.toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'});
  if(rtViewDate===todayStr()) label='Today · '+label;
  document.getElementById('rt-date-label').textContent=label;

  if(isToday){ if(!rtEditMode) renderRtMetrics(); renderRtGroups(); }
  else renderRtStats();
}

// ---------- init ----------
currentPlanId = mostRecentPlanId();
if(state.plans.length){ renderPlanBar(); renderCards(); }
renderInsights();
renderRoutine();

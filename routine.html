<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Routine Dashboard</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.44.0/tabler-icons.min.css">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#F3F5F4;--s0:#E7EBE9;--s1:#FFFFFF;--s2:#FBFCFC;
  --bd:#DFE4E2;--bds:#C7CFCC;--bda:#0E9488;
  --tp:#122421;--ts:#43524F;--tm:#8A9592;
  --font:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
}
.sync-box{display:flex;align-items:center;justify-content:flex-end;gap:8px;padding:2px 2px 0}
.sync-status{font-size:11px;color:var(--tm);font-family:var(--font);white-space:nowrap}
.sync-status.synced{color:#0E9488}
.sync-status.syncing{color:#854F0B}
.sync-status.err{color:#B3261E}
.sync-btn{font-size:11px;font-family:var(--font);border:1px solid var(--bd);background:var(--s1);color:var(--tp);padding:5px 12px;border-radius:6px;cursor:pointer}
.sync-btn:hover{background:var(--s0)}
body{font-family:var(--font);background:var(--bg);padding:1.5rem;color:var(--tp);line-height:1.4}
.dash{max-width:980px;margin:0 auto;display:flex;flex-direction:column;gap:.9rem}
input,select,button{font-family:var(--font);color:var(--tp)}
input[type=text],input[type=number],input[type=date],input[type=time],select{
  border:0.5px solid var(--bds);border-radius:6px;background:var(--s2);padding:4px 6px;outline:none;font-size:13px;
}
input[type=text]:focus,input[type=number]:focus,input[type=date]:focus,input[type=time]:focus,select:focus{border-color:var(--bda);box-shadow:0 0 0 1px var(--bda)}
input[type=number]::-webkit-inner-spin-button,input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
input[type=number]{-moz-appearance:textfield}
button{border:0.5px solid var(--bds);border-radius:6px;background:var(--s1);cursor:pointer;color:var(--ts);transition:background .12s}
button:hover{background:var(--s0)}
button:active{transform:scale(.98)}
button:disabled{opacity:.4;cursor:default}
button:disabled:hover{background:var(--s1)}
.icon-btn{width:28px;height:28px;display:flex;align-items:center;justify-content:center;padding:0;flex-shrink:0}
.plain-input{border:none;background:transparent;padding:0}
.plain-input:focus{box-shadow:none;border:none}

/* TOP TABS */
.topbar{display:flex;align-items:center;gap:4px}
.tab-btn{border:0.5px solid transparent;background:transparent;font-size:14px;color:var(--ts);height:32px;padding:0 14px;border-radius:7px}
.tab-btn:hover{background:var(--s0)}
.tab-btn.active{background:var(--s1);border-color:var(--bd);color:var(--tp);font-weight:500}
.tab-spacer{flex:1}
.tab-pane{display:none;flex-direction:column;gap:.9rem}
.tab-pane.active{display:flex}

/* PLAN BANNER */
.plan-bar{background:var(--s1);border:0.5px solid var(--bd);border-radius:10px;padding:.6rem .9rem;display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:12px;color:var(--ts)}
.plan-bar-left{display:flex;align-items:center;gap:8px;flex:1;min-width:0}
.plan-select{border:none;background:transparent;font-weight:500;color:var(--tp);font-size:13px;flex:1;min-width:0;padding-right:18px;text-overflow:ellipsis}
.plan-select:focus{box-shadow:none}

/* INSIGHTS */
.card{background:var(--s1);border:0.5px solid var(--bd);border-radius:12px;padding:1.1rem 1.3rem;min-width:0}
.eyebrow{font-size:11px;font-weight:500;color:var(--tm);text-transform:uppercase;letter-spacing:.06em}
.insights-hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;flex-wrap:wrap;gap:8px}
.insights-grid{display:grid;grid-template-columns:1fr 1fr;gap:1.5rem;align-items:stretch}
.insights-col{display:flex;flex-direction:column;min-height:0}
.chart-box{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:130px;border:1px dashed var(--bds);border-radius:8px;color:var(--tm);font-size:12px;text-align:center;padding:8px 4px;overflow:auto}
@media(max-width:640px){.insights-grid{grid-template-columns:1fr}}
.prog-label{display:flex;justify-content:space-between;font-size:12px;margin-bottom:3px}
.prog-track{height:8px;background:var(--s0);border-radius:4px;overflow:hidden;margin-bottom:10px}
.prog-fill{height:100%;background:var(--bda);border-radius:4px;transition:width .2s}
.motivate{background:#E4F3F1;border-radius:8px;padding:10px 12px;font-size:12px;color:#0B5D54;line-height:1.5;margin-top:6px}
.chart-legend{display:flex;flex-wrap:wrap;gap:6px 12px;margin-top:8px}
.legend-item{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--ts);cursor:pointer;user-select:none;background:none;border:none;padding:0}
.legend-item.static{cursor:default}
.legend-item .dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.legend-item.off{color:var(--tm);text-decoration:line-through;opacity:.55}
.cal-wrap{display:flex;flex-direction:column;height:100%;width:100%;max-width:320px}
.cal-dow-row{display:grid;grid-template-columns:repeat(7,1fr);flex-shrink:0;margin-bottom:2px}
.cal-dow{font-size:9px;color:var(--tm);text-align:center}
.cal-weeks{flex:1;display:grid;grid-template-columns:repeat(7,1fr);grid-template-rows:repeat(6,1fr);gap:2px;min-height:0}
.cal-cell{border-radius:3px;background:var(--s2,rgba(0,0,0,.04));border:1px solid var(--bds);font-size:9px;display:flex;align-items:center;justify-content:center;color:var(--tm)}
.cal-cell.empty{visibility:hidden}
.cal-cell.filled{background:var(--bda);color:#fff;border-color:transparent}
.cal-cell.out-of-range{opacity:.35}

/* DAY CARDS */
.cards-grid{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:1rem}
@media(max-width:640px){.cards-grid{grid-auto-flow:row;grid-auto-columns:unset;grid-template-columns:1fr}}
.day-card-hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.day-name-label{font-weight:500;font-size:15px;width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.date-row{display:flex;align-items:center;gap:6px;margin-bottom:12px}
.date-row input[type=date]{flex:1;font-size:12px;height:30px}
.log-btn{height:30px;padding:0 12px;font-size:12px;white-space:nowrap;font-weight:500}
.log-btn.is-logged{border-color:var(--bda);color:var(--bda);background:#E4F3F1}
.col-hdr{display:grid;grid-template-columns:26px 26px 1fr 92px;gap:6px;font-size:10px;color:var(--tm);padding:0 0 4px;text-transform:uppercase;letter-spacing:.03em}
.ex-row{display:grid;grid-template-columns:26px 26px 1fr 92px;gap:6px;align-items:center;padding:7px 0;border-bottom:0.5px solid var(--bd)}
.static-val{font-size:13px;text-align:center;color:var(--ts)}
.static-name{font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.stepper{display:flex;align-items:center;justify-content:flex-end;gap:2px}
.stepper button{width:20px;height:26px;padding:0;font-size:14px;line-height:1;flex-shrink:0}
.stepper input{width:34px;height:26px;text-align:center;font-size:12px;padding:0}
.empty-hint{font-size:12px;color:var(--tm);padding:.5rem 0}

/* ===== ROUTINE ===== */
.rt-subtabs{display:flex;gap:16px;border-bottom:0.5px solid var(--bd)}
.rt-subtab{border:none;background:none;border-radius:0;font-size:13px;color:var(--ts);padding:7px 0;border-bottom:2px solid transparent}
.rt-subtab:hover{background:none;color:var(--tp)}
.rt-subtab.active{color:var(--tp);font-weight:500;border-bottom-color:var(--tp)}
.rt-toolbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.rt-daylabel{font-size:14px;font-weight:500;min-width:140px;text-align:center}
.rt-small-btn{height:28px;padding:0 10px;font-size:12px}
.rt-small-btn.on{border-color:var(--bda);color:var(--bda);background:#E4F3F1}
.rt-metrics{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
@media(max-width:640px){.rt-metrics{grid-template-columns:repeat(2,minmax(0,1fr))}}
.rt-metric{background:var(--s0);border-radius:8px;padding:10px 12px;min-width:0}
.rt-metric .l{font-size:11px;color:var(--ts);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rt-metric .v{font-size:20px;font-weight:500;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rt-group-hdr{display:flex;align-items:center;gap:6px;margin:14px 0 6px}
.rt-group-name{font-size:11px;font-weight:500;color:var(--tm);text-transform:uppercase;letter-spacing:.06em;border:none;background:transparent;padding:0;max-width:200px}
.rt-group-name:focus{box-shadow:none;color:var(--tp)}
.rt-rows{background:var(--s1);border:0.5px solid var(--bd);border-radius:10px}
.rt-rows.empty{border-style:dashed;padding:10px 12px;font-size:12px;color:var(--tm)}
.rt-row{display:flex;align-items:center;gap:10px;padding:9px 12px;border-bottom:0.5px solid var(--bd);background:var(--s1);touch-action:none}
.rt-row:last-child{border-bottom:none}
.rt-row:first-child{border-radius:10px 10px 0 0}
.rt-row:last-child{border-radius:0 0 10px 10px}
.rt-row.dragging{opacity:.55}
.rt-row.na{opacity:.45}
.rt-handle{cursor:grab;color:var(--tm);font-size:15px;display:flex;align-items:center;flex-shrink:0}
.rt-check{width:21px;height:21px;border-radius:50%;border:1.5px solid var(--bds);background:transparent;padding:0;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:12px}
.rt-check.done{background:var(--bda);border-color:var(--bda);color:#fff}
.rt-check.skipped{border-style:dashed;color:var(--tm)}
.rt-check.linked{border-style:dotted;cursor:default}
.rt-name{flex:1;font-size:14px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rt-name .sub{font-size:11px;color:var(--tm);margin-left:6px}
.rt-hint{font-size:11px;color:var(--tm);white-space:nowrap;flex-shrink:0}
.rt-note{border:0.5px solid var(--bd);border-radius:6px;height:30px;font-size:12px;width:190px;background:var(--s2);flex-shrink:0}
@media(max-width:640px){.rt-note{width:120px}}
.rt-time{height:30px;font-size:12px;flex-shrink:0}
.rt-pill{font-size:11px;padding:3px 10px;border-radius:6px;background:#E4F3F1;color:#0B5D54;white-space:nowrap}
.rt-pill.grey{background:var(--s0);color:var(--tm)}
.rt-addblock{width:100%;border-style:dashed;font-size:12px;height:32px;margin-top:6px}
.rt-menu{position:absolute;background:var(--s1);border:0.5px solid var(--bds);border-radius:8px;box-shadow:0 6px 20px rgba(0,0,0,.12);padding:4px;z-index:600;min-width:150px}
.rt-menu button{display:block;width:100%;text-align:left;border:none;background:none;font-size:13px;padding:7px 10px;border-radius:5px;color:var(--tp)}
.rt-menu button:hover{background:var(--s0)}
.rt-menu button.danger{color:#B3261E}

/* STATS */
.rt-seg{display:flex;gap:4px}
.rt-seg button{height:28px;padding:0 13px;font-size:12px}
.rt-seg button.active{background:#E4F3F1;border-color:var(--bda);color:#0B5D54;font-weight:500}
.rt-mx-head,.rt-mx-row{display:grid;gap:4px;align-items:center}
.rt-mx-row{margin-bottom:4px}
.rt-mx-label{font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;background:none;border:none;text-align:left;padding:0;color:var(--tp)}
.rt-mx-label:hover{background:none;color:var(--bda)}
.rt-mx-cell{height:22px;border-radius:3px;background:var(--s0)}
.rt-mx-cell.f{background:var(--bda)}
.rt-mx-cell.na{background:transparent;border:1px dashed var(--bd)}
.rt-mx-pct{font-size:12px;color:var(--ts);text-align:right}
.rt-mx-tick{font-size:9px;color:var(--tm);text-align:center;overflow:hidden;white-space:nowrap}
.rt-detail{background:var(--s2);border:0.5px solid var(--bd);border-radius:8px;padding:10px;margin:2px 0 8px}
.rt-legend-row{display:flex;align-items:center;gap:8px;font-size:11px;color:var(--tm);margin-top:12px;flex-wrap:wrap}
.rt-legend-swatch{width:20px;height:11px;border-radius:2px;background:var(--bda)}

/* MODAL */
.overlay{position:fixed;inset:0;background:rgba(18,36,33,.35);display:none;align-items:flex-start;justify-content:center;padding:4vh 1rem;z-index:500;overflow:auto}
.overlay.open{display:flex}
.modal{background:var(--s1);border-radius:12px;padding:1.5rem;max-width:560px;width:100%;box-shadow:0 8px 30px rgba(0,0,0,.15)}
.modal h2{font-size:16px;font-weight:500;margin-bottom:1rem}
.field{margin-bottom:12px}
.field label{display:block;font-size:12px;color:var(--ts);margin-bottom:4px}
.field input{width:100%;height:34px}
.field select{width:100%;height:34px}
.field-row{display:flex;gap:10px}
.field-row .field{flex:1}
.setup-card-block{border:0.5px solid var(--bd);border-radius:8px;padding:12px;margin-bottom:10px;background:var(--s2)}
.setup-card-top{display:flex;gap:10px;margin-bottom:10px;align-items:center}
.setup-card-top input[type=text]{flex:2;height:32px}
.setup-card-top input[type=number]{flex:1;height:32px}
.setup-ex-row{display:flex;gap:6px;align-items:center;margin-bottom:6px}
.setup-ex-row input[type=text]{flex:1;height:30px}
.setup-ex-row input[type=number]{width:52px;height:30px;text-align:center}
.setup-ex-row select{width:84px;height:30px}
.setup-add-ex{font-size:11px;height:28px;padding:0 8px;border-style:dashed}
.add-day-block-btn{width:100%;border-style:dashed;font-size:13px;height:36px}
.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:1rem;flex-wrap:wrap}
.modal-actions button{height:34px;padding:0 14px;font-size:13px}
.primary-btn{background:var(--bda);color:#fff;border-color:var(--bda)}
.primary-btn:hover{background:#0B7B71}
.hint{font-size:11px;color:var(--tm);margin-top:4px}
.rt-days{display:flex;gap:6px}
.rt-days button{width:34px;height:32px;font-size:12px;padding:0}
.rt-days button.on{background:#E4F3F1;border-color:var(--bda);color:#0B5D54;font-weight:500}
</style>
</head>
<body>
<div class="dash">
  <div class="sync-box">
    <span id="sync-status" class="sync-status">Not signed in</span>
    <button id="sync-btn" class="sync-btn">Sign in</button>
  </div>

  <div class="topbar">
    <button class="tab-btn active" data-tab="routine">Routine</button>
    <button class="tab-btn" data-tab="workout">Workout</button>
    <span class="tab-spacer"></span>
  </div>

  <!-- ============ ROUTINE TAB ============ -->
  <div class="tab-pane active" id="pane-routine">
    <div class="rt-subtabs">
      <button class="rt-subtab active" data-sub="today">Today</button>
      <button class="rt-subtab" data-sub="stats">Stats</button>
    </div>

    <div id="rt-today-view">
      <div class="card">
        <div class="rt-toolbar" style="margin-bottom:14px">
          <button class="icon-btn" id="rt-prev" title="Previous day"><i class="ti ti-chevron-left" style="font-size:14px"></i></button>
          <span class="rt-daylabel" id="rt-daylabel"></span>
          <button class="icon-btn" id="rt-next" title="Next day"><i class="ti ti-chevron-right" style="font-size:14px"></i></button>
          <button class="rt-small-btn" id="rt-today-btn">Today</button>
          <span style="flex:1"></span>
          <button class="rt-small-btn" id="rt-edit-toggle"><i class="ti ti-pencil" style="font-size:12px;vertical-align:-2px;margin-right:4px"></i>Edit routine</button>
        </div>
        <div class="rt-metrics" id="rt-metrics"></div>
        <div id="rt-groups"></div>
        <button class="rt-addblock" id="rt-add-group" style="display:none;margin-top:14px"><i class="ti ti-plus" style="font-size:12px;vertical-align:-2px;margin-right:4px"></i>Add group</button>
      </div>
    </div>

    <div id="rt-stats-view" style="display:none">
      <div class="card">
        <div class="insights-hdr">
          <div class="rt-seg" id="rt-gran">
            <button data-g="daily">Daily</button>
            <button data-g="weekly" class="active">Weekly</button>
            <button data-g="monthly">Monthly</button>
          </div>
          <span class="rt-hint" id="rt-range-label"></span>
        </div>
        <div class="rt-metrics" id="rt-stat-metrics" style="margin-bottom:18px"></div>
        <div id="rt-matrix"></div>
        <div class="rt-legend-row">
          <span>0%</span>
          <div style="display:flex;gap:3px">
            <div class="rt-legend-swatch" style="background:var(--s0)"></div>
            <div class="rt-legend-swatch" style="opacity:.3"></div>
            <div class="rt-legend-swatch" style="opacity:.55"></div>
            <div class="rt-legend-swatch" style="opacity:.8"></div>
            <div class="rt-legend-swatch"></div>
          </div>
          <span>100%</span>
          <span style="margin-left:8px">Click a name to open its chart</span>
        </div>
      </div>
    </div>
  </div>

  <!-- ============ WORKOUT TAB ============ -->
  <div class="tab-pane" id="pane-workout">
    <div class="plan-bar" id="plan-bar" style="display:none">
      <div class="plan-bar-left">
        <i class="ti ti-target-arrow" style="font-size:14px;color:var(--tm)" aria-hidden="true"></i>
        <select class="plan-select" id="plan-select"></select>
      </div>
      <div style="display:flex;gap:4px">
        <button class="icon-btn" id="edit-plan-btn" title="Edit plan"><i class="ti ti-pencil" style="font-size:13px"></i></button>
      </div>
    </div>

    <div class="card">
      <div class="insights-hdr">
        <span class="eyebrow">Progress tracker</span>
        <select id="chart-select" style="height:26px;font-size:11px"></select>
      </div>
      <div class="insights-grid">
        <div class="insights-col">
          <div id="progress-bars"></div>
          <div class="motivate" id="motivate-text"></div>
        </div>
        <div class="insights-col chart-col">
          <div class="chart-box" id="chart-box">pick a workout day to see progress</div>
          <div class="chart-legend" id="chart-legend"></div>
        </div>
      </div>
    </div>

    <div class="cards-grid" id="cards-grid"></div>
  </div>
</div>

<!-- Plan setup / edit modal (workout) -->
<div class="overlay" id="setup-overlay">
  <div class="modal">
    <h2 id="setup-title">Set up your plan</h2>
    <div class="field"><label>Plan name</label><input type="text" id="setup-name" value="Plan 1"></div>
    <div class="field-row">
      <div class="field"><label>Start date</label><input type="date" id="setup-start"></div>
      <div class="field"><label>End date</label><input type="date" id="setup-end"></div>
    </div>
    <div id="setup-card-list"></div>
    <button class="add-day-block-btn" id="setup-add-day"><i class="ti ti-plus" style="font-size:13px;vertical-align:-2px;margin-right:5px"></i>Add day</button>
    <div class="hint">Set the exercises, sets, and reps for each day here. You'll only log weight from the cards afterward.</div>
    <div class="modal-actions">
      <button id="setup-delete" style="display:none;color:#c0392b;margin-right:auto">Delete plan</button>
      <button id="setup-cancel">Cancel</button>
      <button class="primary-btn" id="setup-create">Create plan</button>
    </div>
  </div>
</div>

<!-- Block editor modal (routine) -->
<div class="overlay" id="rt-block-overlay">
  <div class="modal">
    <h2 id="rt-block-title">Edit block</h2>
    <div class="field"><label>Name</label><input type="text" id="rt-b-name"></div>
    <div class="field-row">
      <div class="field"><label>Group</label><select id="rt-b-group"></select></div>
      <div class="field"><label>Type</label><select id="rt-b-type">
        <option value="check">Check</option>
        <option value="time">Time</option>
        <option value="duration">Duration</option>
        <option value="note">Note</option>
      </select></div>
    </div>
    <div class="field-row">
      <div class="field" id="rt-b-target-wrap"><label id="rt-b-target-label">Target</label><input type="text" id="rt-b-target"></div>
      <div class="field" id="rt-b-role-wrap"><label>Sleep role</label><select id="rt-b-role">
        <option value="">None</option>
        <option value="wake">Wake time</option>
        <option value="bed">Bed time</option>
      </select></div>
      <div class="field" id="rt-b-link-wrap"><label>Source</label><select id="rt-b-link">
        <option value="">Manual — check it off yourself</option>
        <option value="workout">Linked — reflects today's workout log</option>
      </select></div>
    </div>
    <div class="field">
      <label>Days</label>
      <div class="rt-days" id="rt-b-days"></div>
      <div class="hint">Unchecked days are not counted as missed.</div>
    </div>
    <div class="field"><label>Note prompt</label><input type="text" id="rt-b-note" placeholder="Optional placeholder text"></div>
    <div class="modal-actions">
      <button id="rt-b-delete" style="color:#c0392b;margin-right:auto">Delete</button>
      <button id="rt-b-pause">Pause</button>
      <button id="rt-b-cancel">Cancel</button>
      <button class="primary-btn" id="rt-b-save">Save</button>

<script>

  authDomain:"my-dashboards-ce750.firebaseapp.com",

  appId:"1:181288810167:web:1e25b8e2b75ec4d4c8ff32"
};
firebase.initializeApp(firebaseConfig);
const fbAuth=firebase.auth();
const fbDb=firebase.database();
let cloudUser=null,cloudSaveTimer=null,cloudApplyingRemote=false,cloudReady=false;
let rtCloudSaveTimer=null,rtCloudApplyingRemote=false,rtCloudReady=false;
const mySessionId=Math.random().toString(36).slice(2)+Date.now().toString(36);

function setSyncStatus(text,cls){
  const el=document.getElementById('sync-status');
  el.textContent=text;
  el.className='sync-status'+(cls?' '+cls:'');
}

function cloudQueueSave(){
  if(!cloudUser||cloudApplyingRemote)return;
  setSyncStatus('Syncing…','syncing');
  clearTimeout(cloudSaveTimer);
  cloudSaveTimer=setTimeout(()=>{
    const raw=localStorage.getItem(STORAGE_KEY)||'{}';
    const payload=JSON.parse(raw);
    payload._rev={sid:mySessionId,t:Date.now()};
    fbDb.ref('users/'+cloudUser.uid+'/workout').set(payload)
      .then(()=>setSyncStatus('Synced','synced'))
      .catch(()=>setSyncStatus('Sync error','err'));
  },900);
}

function rtCloudQueueSave(){
  if(!cloudUser||rtCloudApplyingRemote)return;
  setSyncStatus('Syncing…','syncing');
  clearTimeout(rtCloudSaveTimer);
  rtCloudSaveTimer=setTimeout(()=>{
    const raw=localStorage.getItem(RT_KEY)||'{}';
    const payload=JSON.parse(raw);
    payload._rev={sid:mySessionId,t:Date.now()};
    fbDb.ref('users/'+cloudUser.uid+'/routine').set(payload)
      .then(()=>setSyncStatus('Synced','synced'))
      .catch(()=>setSyncStatus('Sync error','err'));
  },900);
}

function normalizeWorkoutState(data){
  if(!data||typeof data!=='object')return {plans:[]};
  if(!Array.isArray(data.plans))data.plans=[];
  data.plans.forEach(plan=>{
    if(!Array.isArray(plan.cards))plan.cards=[];
    plan.cards.forEach(card=>{
      if(!Array.isArray(card.exercises))card.exercises=[];
      if(!card.logs||typeof card.logs!=='object')card.logs={};
    });
  });
  return data;
}

function cloudApplyRemote(data){
  cloudApplyingRemote=true;
  try{
    if(data&&data.plans){
      state=normalizeWorkoutState(data);
      localStorage.setItem(STORAGE_KEY,JSON.stringify(state));
      document.getElementById('setup-overlay').classList.remove('open');
      renderAll();
      if(typeof rtRenderAll==='function')rtRenderAll();
    }
  }finally{
    cloudApplyingRemote=false;
  }
}

function rtCloudApplyRemote(data){
  rtCloudApplyingRemote=true;
  try{
    rtState=rtNormalize(data);
    localStorage.setItem(RT_KEY,JSON.stringify(rtState));
    document.getElementById('rt-block-overlay').classList.remove('open');
    rtRenderAll();
  }finally{
    rtCloudApplyingRemote=false;
  }
}

function cloudSignIn(){
  const provider=new firebase.auth.GoogleAuthProvider();
  fbAuth.signInWithPopup(provider).catch(()=>setSyncStatus('Sign-in failed','err'));
}
function cloudSignOut(){fbAuth.signOut();}

document.getElementById('sync-btn').onclick=()=>{
  if(cloudUser)cloudSignOut();else cloudSignIn();
};

let cloudInitializedForUid=null;
fbAuth.onAuthStateChanged(user=>{
  cloudUser=user;
  if(user){
    document.getElementById('sync-btn').textContent='Sign out';
    if(cloudInitializedForUid===user.uid)return;
    cloudInitializedForUid=user.uid;
    setSyncStatus('Connecting…','syncing');

    const ref=fbDb.ref('users/'+user.uid+'/workout');
    ref.once('value').then(snap=>{
      const remote=snap.val();
      const localRaw=localStorage.getItem(STORAGE_KEY);
      const local=localRaw?JSON.parse(localRaw):null;
      const remoteTime=(remote&&remote.updatedAt)||0;
      const localTime=(local&&local.updatedAt)||0;
      if(remote&&remote.plans&&remoteTime>=localTime){
        cloudApplyRemote(remote);
      }else{
        cloudQueueSave();
      }
      cloudReady=true;
      setSyncStatus('Synced','synced');
      ref.on('value',snap2=>{
        if(!cloudReady||cloudApplyingRemote)return;
        const remote2=snap2.val();
        if(remote2&&remote2._rev&&remote2._rev.sid===mySessionId)return;
        if(remote2&&remote2.plans)cloudApplyRemote(remote2);
      });
    });

    const rtRef=fbDb.ref('users/'+user.uid+'/routine');
    rtRef.once('value').then(snap=>{
      const remote=snap.val();
      const localRaw=localStorage.getItem(RT_KEY);
      const local=localRaw?JSON.parse(localRaw):null;
      const remoteTime=(remote&&remote.updatedAt)||0;
      const localTime=(local&&local.updatedAt)||0;
      if(remote&&remote.blocks&&remoteTime>=localTime){
        rtCloudApplyRemote(remote);
      }else{
        rtCloudQueueSave();
      }
      rtCloudReady=true;
      rtRef.on('value',snap2=>{
        if(!rtCloudReady||rtCloudApplyingRemote)return;
        const remote2=snap2.val();
        if(remote2&&remote2._rev&&remote2._rev.sid===mySessionId)return;
        if(remote2&&remote2.blocks)rtCloudApplyRemote(remote2);
      });
    });

  }else{
    cloudInitializedForUid=null;
    cloudReady=false;
    rtCloudReady=false;
    document.getElementById('sync-btn').textContent='Sign in';
    setSyncStatus('Not signed in','');
  }
});
</script>

<script>
/* =====================================================================
   WORKOUT  — unchanged logic from the original dashboard
   ===================================================================== */
const STORAGE_KEY = 'workoutDashboardData_v2';
const BAND_OPTIONS = ['LB','DB'];
const todayStr = () => {
  const d=new Date();
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
};
const uid = () => Math.random().toString(36).slice(2,10);

function loadData(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(raw) return JSON.parse(raw);
  }catch(e){ console.error('Failed to load data', e); }
  return { plans: [] };
}
function saveData(){ state.updatedAt=Date.now(); localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); cloudQueueSave(); }

let state = normalizeWorkoutState(loadData());
let currentPlanId = null;
let chartSelectedValue = '__all__';
let visibleChartExercises = new Set();
const CHART_COLORS = ['#0E9488','#3B82F6','#F59E0B','#A855F7','#EF4444','#10B981','#6366F1','#EC4899'];
let cardUiDate = {};
let unlockedCards = new Set();

function getCurrentPlan(){ return state.plans.find(p => p.id === currentPlanId) || null; }
function mostRecentPlanId(){
  if(!state.plans.length) return null;
  return [...state.plans].sort((a,b)=> b.createdAt - a.createdAt)[0].id;
}
function fmtDate(d){
  if(!d) return '';
  return new Date(d+'T00:00:00').toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'});
}
function escapeHtml(s){
  return (s||'').replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}

// ============ PLAN SETUP / EDIT MODAL (shared) ============
const setupOverlay = document.getElementById('setup-overlay');
const setupCardList = document.getElementById('setup-card-list');
let setupState = { cards: [] };
let editingPlanId = null;

function blankSetupCard(i){ return { id:null, name:`Day ${i+1}`, target:16, exercises:[ blankSetupExercise() ] }; }
function blankSetupExercise(){ return { id:null, name:'', sets:3, reps:10, type:'weight' }; }

function renderSetupCards(){
  setupCardList.innerHTML = '';
  setupState.cards.forEach((card, ci)=>{
    const block = document.createElement('div'); block.className='setup-card-block';
    const top = document.createElement('div'); top.className='setup-card-top';
    const nameInp = document.createElement('input'); nameInp.type='text'; nameInp.placeholder='Day name'; nameInp.value=card.name;
    nameInp.addEventListener('input', ()=> card.name = nameInp.value);
    const targetInp = document.createElement('input'); targetInp.type='number'; targetInp.min=0; targetInp.value=card.target; targetInp.title='Target sessions';
    targetInp.addEventListener('input', ()=> card.target = parseInt(targetInp.value)||0);
    const rmDayBtn = document.createElement('button'); rmDayBtn.className='icon-btn'; rmDayBtn.title='Remove this day';
    rmDayBtn.innerHTML = '<i class="ti ti-trash" style="font-size:13px"></i>';
    rmDayBtn.addEventListener('click', ()=>{ setupState.cards.splice(ci,1); renderSetupCards(); });
    top.appendChild(nameInp); top.appendChild(targetInp); top.appendChild(rmDayBtn);
    block.appendChild(top);

    const exList = document.createElement('div');
    card.exercises.forEach((ex, ei)=>{
      const row = document.createElement('div'); row.className='setup-ex-row';
      const exName = document.createElement('input'); exName.type='text'; exName.placeholder='Exercise name'; exName.value=ex.name;
      exName.addEventListener('input', ()=> ex.name = exName.value);
      const setsInp = document.createElement('input'); setsInp.type='number'; setsInp.min=1; setsInp.value=ex.sets; setsInp.title='Sets';
      setsInp.addEventListener('input', ()=> ex.sets = parseInt(setsInp.value)||0);
      const repsInp = document.createElement('input'); repsInp.type='number'; repsInp.min=1; repsInp.value=ex.reps; repsInp.title='Reps';
      repsInp.addEventListener('input', ()=> ex.reps = parseInt(repsInp.value)||0);
      const typeSel = document.createElement('select');
      typeSel.innerHTML = `<option value="weight">Weight</option><option value="band">Band</option>`;
      typeSel.value = ex.type;
      typeSel.addEventListener('change', ()=> ex.type = typeSel.value);
      const rmBtn = document.createElement('button'); rmBtn.className='icon-btn'; rmBtn.title='Remove exercise';
      rmBtn.innerHTML = '<i class="ti ti-x" style="font-size:13px"></i>';
      rmBtn.addEventListener('click', ()=>{ card.exercises.splice(ei,1); renderSetupCards(); });
      row.appendChild(exName); row.appendChild(setsInp); row.appendChild(repsInp); row.appendChild(typeSel); row.appendChild(rmBtn);
      exList.appendChild(row);
    });
    block.appendChild(exList);

    const addExBtn = document.createElement('button'); addExBtn.className='setup-add-ex';
    addExBtn.innerHTML = '<i class="ti ti-plus" style="font-size:12px;vertical-align:-2px;margin-right:3px"></i>Add exercise';
    addExBtn.addEventListener('click', ()=>{ card.exercises.push(blankSetupExercise()); renderSetupCards(); });
    block.appendChild(addExBtn);

    setupCardList.appendChild(block);
  });
}
document.getElementById('setup-add-day').addEventListener('click', ()=>{
  setupState.cards.push(blankSetupCard(setupState.cards.length));
  renderSetupCards();
});

function openCreateModal(){
  editingPlanId = null;
  document.getElementById('setup-title').textContent = 'Set up your plan';
  document.getElementById('setup-create').textContent = 'Create plan';
  document.getElementById('setup-name').value = 'Plan ' + (state.plans.length+1);
  document.getElementById('setup-start').value = todayStr();
  const end = new Date(); end.setMonth(end.getMonth()+2);
  document.getElementById('setup-end').value = end.toISOString().slice(0,10);
  setupState = { cards: [blankSetupCard(0), blankSetupCard(1)] };
  renderSetupCards();
  document.getElementById('setup-delete').style.display = 'none';
  setupOverlay.classList.add('open');
}
function openEditModal(){
  const plan = getCurrentPlan();
  if(!plan) return;
  editingPlanId = plan.id;
  document.getElementById('setup-title').textContent = 'Edit plan';
  document.getElementById('setup-create').textContent = 'Save changes';
  document.getElementById('setup-name').value = plan.name;
  document.getElementById('setup-start').value = plan.startDate;
  document.getElementById('setup-end').value = plan.endDate;
  setupState = { cards: plan.cards.map(c=>({
    id: c.id, name: c.name, target: c.target,
    exercises: c.exercises.map(e=>({ id:e.id, name:e.name, sets:e.sets, reps:e.reps, type:e.type }))
  })) };
  if(!setupState.cards.length) setupState.cards.push(blankSetupCard(0));
  renderSetupCards();
  document.getElementById('setup-delete').style.display = '';
  setupOverlay.classList.add('open');
}
document.getElementById('edit-plan-btn').addEventListener('click', openEditModal);
document.getElementById('setup-cancel').addEventListener('click', ()=>{
  if(state.plans.length) setupOverlay.classList.remove('open');
  else { setupOverlay.classList.remove('open'); switchTab('routine'); }
});
document.getElementById('setup-delete').addEventListener('click', ()=>{
  const plan = state.plans.find(p=>p.id===editingPlanId);
  if(!plan) return;
  if(!confirm(`Delete "${plan.name}"? This will permanently remove its plan and all logged workouts. This cannot be undone.`)) return;
  state.plans = state.plans.filter(p=>p.id!==editingPlanId);
  if(currentPlanId===editingPlanId) currentPlanId = null;
  editingPlanId = null;
  cardUiDate = {}; unlockedCards = new Set();
  saveData();
  setupOverlay.classList.remove('open');
  renderAll();
  if(typeof rtRenderAll==='function') rtRenderAll();
});
document.getElementById('setup-create').addEventListener('click', ()=>{
  const name = document.getElementById('setup-name').value.trim() || ('Plan ' + (state.plans.length+1));
  const startDate = document.getElementById('setup-start').value || todayStr();
  const endDate = document.getElementById('setup-end').value || startDate;

  const existingCardsById = {};
  if(editingPlanId){
    const existingPlan = state.plans.find(p=>p.id===editingPlanId);
    if(existingPlan) existingPlan.cards.forEach(c=> existingCardsById[c.id]=c);
  }

  const cards = setupState.cards.map(c=>{
    const cardId = c.id || uid();
    const existingCard = c.id ? existingCardsById[c.id] : null;
    const logs = existingCard ? existingCard.logs : {};
    return {
      id: cardId,
      name: c.name.trim() || 'Day',
      target: Math.max(0, c.target||0),
      exercises: c.exercises.filter(e=>e.name.trim()!=='').map(e=>({
        id: e.id || uid(), name: e.name.trim(), sets: Math.max(0,e.sets||0), reps: Math.max(0,e.reps||0), type: e.type
      })),
      logs
    };
  });

  if(editingPlanId){
    const plan = state.plans.find(p=>p.id===editingPlanId);
    plan.name = name; plan.startDate = startDate; plan.endDate = endDate; plan.cards = cards;
    currentPlanId = plan.id;
  } else {
    const plan = { id: uid(), name, startDate, endDate, createdAt: Date.now(), cards };
    state.plans.push(plan);
    currentPlanId = plan.id;
  }
  cardUiDate = {}; unlockedCards = new Set();
  saveData();
  setupOverlay.classList.remove('open');
  renderAll();
  if(typeof rtRenderAll==='function') rtRenderAll();
});

// ============ PLAN SELECTOR ============
const planSelect = document.getElementById('plan-select');
planSelect.addEventListener('change', ()=>{
  if(planSelect.value === '__new__'){
    planSelect.value = currentPlanId;
    openCreateModal();
    return;
  }
  currentPlanId = planSelect.value;
  cardUiDate = {}; unlockedCards = new Set();
  renderAll();
});

function renderPlanBar(){
  const bar = document.getElementById('plan-bar');
  if(!state.plans.length){ bar.style.display='none'; return; }
  bar.style.display='flex';
  const sorted = [...state.plans].sort((a,b)=> b.createdAt - a.createdAt);
  planSelect.innerHTML = sorted.map(p=>`<option value="${p.id}">${escapeHtml(p.name)} · ${fmtDate(p.startDate)}–${fmtDate(p.endDate)}</option>`).join('')
    + `<option value="__new__">+ New plan…</option>`;
  planSelect.value = currentPlanId;
}

// ============ DAY CARDS ============
const cardsGrid = document.getElementById('cards-grid');

function latestLoggedValues(card){
  const dates = Object.keys(card.logs).sort();
  if(!dates.length) return null;
  return card.logs[dates[dates.length-1]];
}
function defaultDateForCard(card){
  const dates = Object.keys(card.logs).sort();
  return dates.length ? dates[dates.length-1] : todayStr();
}

function renderCards(){
  cardsGrid.innerHTML='';
  const plan = getCurrentPlan();
  if(!plan) return;
  plan.cards.forEach(card=>{
    if(!(card.id in cardUiDate)) cardUiDate[card.id] = defaultDateForCard(card);
    cardsGrid.appendChild(makeCardEl(plan, card));
  });
}

function makeStepper(kind, startVal, disabled, exId){
  const wrap = document.createElement('div'); wrap.className='stepper';
  const minus = document.createElement('button'); minus.type='button'; minus.textContent='−';
  const box = document.createElement('input'); box.type='text'; box.readOnly=true; box.dataset.ex = exId;
  const plus = document.createElement('button'); plus.type='button'; plus.textContent='+';
  minus.disabled = disabled; plus.disabled = disabled; box.disabled = disabled;

  if(kind==='weight'){
    let val = Math.max(0, Math.min(140, parseInt(startVal)||0));
    box.value = val;
    minus.addEventListener('click', ()=>{ val = Math.max(0, val-10); box.value = val; });
    plus.addEventListener('click', ()=>{ val = Math.min(140, val+10); box.value = val; });
  } else {
    let idx = Math.max(0, BAND_OPTIONS.indexOf(startVal));
    box.value = BAND_OPTIONS[idx];
    minus.addEventListener('click', ()=>{ idx = Math.max(0, idx-1); box.value = BAND_OPTIONS[idx]; });
    plus.addEventListener('click', ()=>{ idx = Math.min(BAND_OPTIONS.length-1, idx+1); box.value = BAND_OPTIONS[idx]; });
  }
  wrap.appendChild(minus); wrap.appendChild(box); wrap.appendChild(plus);
  return wrap;
}

function makeCardEl(plan, card){
  const el = document.createElement('div'); el.className='card';
  const date = cardUiDate[card.id];
  const existingLog = card.logs[date];
  const isUnlocked = unlockedCards.has(card.id);
  const isLoggedView = !!existingLog && !isUnlocked;

  const hdr = document.createElement('div'); hdr.className='day-card-hdr';
  const nameLabel = document.createElement('div');
  nameLabel.className='day-name-label'; nameLabel.textContent = card.name; nameLabel.title = card.name;
  hdr.appendChild(nameLabel);
  el.appendChild(hdr);

  const dateRow = document.createElement('div'); dateRow.className='date-row';
  const calIcon = document.createElement('i'); calIcon.className='ti ti-calendar'; calIcon.style.cssText='font-size:14px;color:var(--tm)';
  const dateInput = document.createElement('input'); dateInput.type='date'; dateInput.value=date;
  dateInput.addEventListener('change', ()=>{
    cardUiDate[card.id] = dateInput.value;
    unlockedCards.delete(card.id);
    renderCards();
  });
  const logBtn = document.createElement('button'); logBtn.className='log-btn' + (isLoggedView ? ' is-logged' : '');
  logBtn.textContent = isLoggedView ? 'Logged' : 'Log';
  logBtn.addEventListener('click', ()=>{
    if(isLoggedView){
      delete card.logs[date];
      unlockedCards.delete(card.id);
      saveData();
      renderAll();
      if(typeof rtRenderAll==='function') rtRenderAll();
      return;
    }
    const snapshot = {};
    card.exercises.forEach(ex=>{
      const fieldEl = el.querySelector(`[data-ex="${ex.id}"]`);
      snapshot[ex.id] = fieldEl ? fieldEl.value : '';
    });
    card.logs[date] = snapshot;
    unlockedCards.delete(card.id);
    saveData();
    renderAll();
    if(typeof rtRenderAll==='function') rtRenderAll();
  });
  dateRow.appendChild(calIcon); dateRow.appendChild(dateInput); dateRow.appendChild(logBtn);
  el.appendChild(dateRow);

  if(!card.exercises.length){
    const hint = document.createElement('div'); hint.className='empty-hint';
    hint.textContent = 'No exercises defined for this day — edit the plan to add some.';
    el.appendChild(hint);
    return el;
  }

  const colHdr=document.createElement('div'); colHdr.className='col-hdr';
  colHdr.innerHTML='<span style="text-align:center">Sets</span><span style="text-align:center">Reps</span><span></span><span style="text-align:right">Wt</span>';
  el.appendChild(colHdr);

  const defaults = existingLog || latestLoggedValues(card) || {};
  const rows = document.createElement('div');
  card.exercises.forEach(ex=>{
    const row = document.createElement('div'); row.className='ex-row';
    const setsSpan = document.createElement('span'); setsSpan.className='static-val'; setsSpan.textContent = ex.sets;
    const repsSpan = document.createElement('span'); repsSpan.className='static-val'; repsSpan.textContent = ex.reps;
    const nameSpan = document.createElement('span'); nameSpan.className='static-name'; nameSpan.textContent = ex.name; nameSpan.title = ex.name;

    const startVal = existingLog ? (existingLog[ex.id] ?? '') : (defaults[ex.id] ?? (ex.type==='band' ? BAND_OPTIONS[0] : 10));
    const field = makeStepper(ex.type, startVal, isLoggedView, ex.id);

    row.appendChild(setsSpan); row.appendChild(repsSpan); row.appendChild(nameSpan); row.appendChild(field);
    rows.appendChild(row);
  });
  el.appendChild(rows);
  return el;
}

// ============ INSIGHTS ============
function planDurationDays(plan){
  const start = new Date(plan.startDate+'T00:00:00');
  const end = new Date(plan.endDate+'T00:00:00');
  return Math.max(1, Math.round((end-start)/86400000)+1);
}

function renderInsights(){
  const plan = getCurrentPlan();
  const barsEl = document.getElementById('progress-bars');
  const motivateEl = document.getElementById('motivate-text');
  const chartSelect = document.getElementById('chart-select');
  const chartBox = document.getElementById('chart-box');
  const legendEl = document.getElementById('chart-legend');

  if(!plan || !plan.cards.length){
    barsEl.innerHTML=''; motivateEl.textContent='Set up a plan with day cards to start tracking.';
    chartSelect.innerHTML='';
    chartBox.innerHTML='pick a workout day to see progress';
    legendEl.innerHTML='';
    return;
  }

  const totalDays = planDurationDays(plan);

  barsEl.innerHTML='';
  plan.cards.forEach(card=>{
    const count = Object.keys(card.logs).length;
    const target = card.target;
    const pct = target>0 ? Math.min(100, Math.round(count/target*100)) : 0;
    const wrap=document.createElement('div');
    wrap.innerHTML = `<div class="prog-label"><span>${escapeHtml(card.name)}</span><span style="color:var(--tm)">${count} / ${target}</span></div>
      <div class="prog-track"><div class="prog-fill" style="width:${pct}%"></div></div>`;
    barsEl.appendChild(wrap);
  });

  const totalLoggedAllTime = plan.cards.reduce((s,c)=>s+Object.keys(c.logs).length,0);
  const totalTargetAllTime = plan.cards.reduce((s,c)=>s+c.target,0);
  const now = new Date();
  const end = new Date(plan.endDate+'T00:00:00');
  const daysRemaining = Math.max(0, Math.round((end-now)/86400000));
  const remainingSessions = Math.max(0, totalTargetAllTime - totalLoggedAllTime);
  const weeksRemaining = Math.max(1, Math.round(daysRemaining/7));
  const pace = Math.ceil(remainingSessions / weeksRemaining);

  if(totalLoggedAllTime===0){
    motivateEl.textContent = `Your plan runs ${totalDays} days — hit Log on a card once you finish a session to start tracking.`;
  } else if(daysRemaining<=0){
    motivateEl.textContent = `Your plan window has ended — nice work either way.`;
  } else {
    motivateEl.textContent = `${daysRemaining} days left — ${pace} session${pace===1?'':'s'}/week keeps you on pace for your goal.`;
  }

  const months = planMonths(plan);
  const prevSelected = chartSelectedValue;
  const monthValue = m => `__month__${m.year}-${String(m.month+1).padStart(2,'0')}`;
  let monthOptionsHtml, validMonthValues;
  if(months.length<=1){
    monthOptionsHtml = `<option value="__all__">${escapeHtml(plan.name)}</option>`;
    validMonthValues = ['__all__'];
  } else {
    monthOptionsHtml = months.map(m=>{
      const label = new Date(m.year, m.month, 1).toLocaleDateString('en-US',{month:'short',year:'numeric'});
      return `<option value="${monthValue(m)}">${escapeHtml(plan.name)} · ${label}</option>`;
    }).join('');
    validMonthValues = months.map(monthValue);
  }
  chartSelect.innerHTML = monthOptionsHtml + plan.cards.map(c=>`<option value="${c.id}">${escapeHtml(c.name)}</option>`).join('');

  const validValues = new Set([...validMonthValues, ...plan.cards.map(c=>c.id)]);
  chartSelectedValue = validValues.has(prevSelected) ? prevSelected : validMonthValues[0];
  chartSelect.value = chartSelectedValue;

  renderChartPanel(plan);
}

document.getElementById('chart-select').addEventListener('change', ()=>{
  chartSelectedValue = document.getElementById('chart-select').value;
  visibleChartExercises = new Set();
  const plan = getCurrentPlan();
  if(plan) renderChartPanel(plan);
});

function planMonths(plan){
  const start = new Date(plan.startDate+'T00:00:00');
  const end = new Date(plan.endDate+'T00:00:00');
  const months = [];
  const cur = new Date(start.getFullYear(), start.getMonth(), 1);
  const endMonth = new Date(end.getFullYear(), end.getMonth(), 1);
  while(cur<=endMonth){
    months.push({ year: cur.getFullYear(), month: cur.getMonth() });
    cur.setMonth(cur.getMonth()+1);
  }
  return months;
}

function renderChartPanel(plan){
  const legendEl = document.getElementById('chart-legend');
  if(chartSelectedValue === '__all__'){
    drawMonthCalendar(plan, new Date(plan.startDate+'T00:00:00'));
    return;
  }
  if(chartSelectedValue.indexOf('__month__')===0){
    const [y,m] = chartSelectedValue.replace('__month__','').split('-').map(Number);
    drawMonthCalendar(plan, new Date(y, m-1, 1));
    return;
  }
  const card = plan.cards.find(c=>c.id===chartSelectedValue);
  if(!card){ legendEl.innerHTML=''; drawMonthCalendar(plan, new Date(plan.startDate+'T00:00:00')); return; }
  drawDayChart(card);
}

function toDateStr(d){
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}

function drawMonthCalendar(plan, monthDate){
  const box = document.getElementById('chart-box');
  const legendEl = document.getElementById('chart-legend');
  legendEl.innerHTML = '';

  if(!plan.cards.length){
    box.innerHTML = 'set up day cards to start tracking';
    return;
  }

  const loggedDates = new Set();
  plan.cards.forEach(card=>{
    Object.keys(card.logs).forEach(d=> loggedDates.add(d));
  });

  const planStart = new Date(plan.startDate+'T00:00:00');
  const planEnd = new Date(plan.endDate+'T00:00:00');

  const year = monthDate.getFullYear(), month = monthDate.getMonth();
  const firstOfMonth = new Date(year, month, 1);
  const daysInMonth = new Date(year, month+1, 0).getDate();
  const lead = firstOfMonth.getDay();

  const cells = [];
  for(let i=0;i<42;i++){
    const dayNum = i - lead + 1;
    cells.push(dayNum>=1 && dayNum<=daysInMonth ? new Date(year, month, dayNum) : null);
  }

  const cellHtml = cells.map(d=>{
    if(!d) return `<div class="cal-cell empty"></div>`;
    const key = toDateStr(d);
    const filled = loggedDates.has(key);
    const outOfRange = d<planStart || d>planEnd;
    const title = fmtDate(key);
    return `<div class="cal-cell${filled?' filled':''}${outOfRange?' out-of-range':''}" title="${escapeHtml(title)}">${d.getDate()}</div>`;
  }).join('');

  const dowHtml = ['S','M','T','W','T','F','S'].map(l=>`<div class="cal-dow">${l}</div>`).join('');
  box.innerHTML = `<div class="cal-wrap">
    <div class="cal-dow-row">${dowHtml}</div>
    <div class="cal-weeks">${cellHtml}</div>
  </div>`;
}

function niceTicks(min, max, count){
  if(min===max) return [min];
  const ticks=[];
  for(let i=0;i<count;i++) ticks.push(Math.round((min + (max-min)*i/(count-1))*10)/10);
  return [...new Set(ticks)];
}

function drawDayChart(card){
  const box = document.getElementById('chart-box');
  const legendEl = document.getElementById('chart-legend');

  if(!card.exercises.length){
    box.innerHTML = 'no exercises defined for this day';
    legendEl.innerHTML = '';
    return;
  }
  const dates = Object.keys(card.logs).sort();
  if(!dates.length){
    box.innerHTML = 'no sessions logged yet for this day';
    legendEl.innerHTML = '';
    return;
  }

  const series = card.exercises.map((ex,i)=>{
    const points = dates.map(d=>{
      const raw = card.logs[d][ex.id];
      let val = null;
      if(raw!==undefined && raw!==''){
        val = ex.type==='band' ? (raw==='LB'?10 : raw==='DB'?20 : NaN) : parseFloat(raw);
        if(isNaN(val) || val<0) val = null;
      }
      return { date: d, val };
    }).filter(p=>p.val!==null);
    return { id: ex.id, name: ex.name, color: CHART_COLORS[i % CHART_COLORS.length], points };
  });

  legendEl.innerHTML = series.map(s=>
    `<button type="button" class="legend-item${visibleChartExercises.has(s.id)?'':' off'}" data-ex="${s.id}"><span class="dot" style="background:${s.color}"></span>${escapeHtml(s.name)}</button>`
  ).join('');
  legendEl.querySelectorAll('.legend-item').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const id = btn.dataset.ex;
      if(visibleChartExercises.has(id)) visibleChartExercises.delete(id); else visibleChartExercises.add(id);
      const plan = getCurrentPlan();
      if(plan) renderChartPanel(plan);
    });
  });

  const visibleSeries = series.filter(s=> visibleChartExercises.has(s.id) && s.points.length);
  if(!visibleSeries.length){
    box.innerHTML = series.some(s=>s.points.length) ? 'click a legend item to show its curve' : 'no numeric history yet for this day';
    return;
  }

  const w=280,h=110,padL=26,padR=10,padT=8,padB=18;
  const plotW = w-padL-padR, plotH = h-padT-padB;
  const stepX = dates.length>1 ? plotW/(dates.length-1) : 0;
  const xFor = i => padL + i*stepX;

  const allVals = visibleSeries.flatMap(s=>s.points.map(p=>p.val));
  const min = Math.min(...allVals), max = Math.max(...allVals);
  const range = (max-min)||1;
  const yFor = v => padT + plotH - ((v-min)/range)*plotH;
  const ticks = niceTicks(min, max, 4);

  const gridlines = ticks.map(t=>{
    const y = yFor(t);
    return `<line x1="${padL}" y1="${y.toFixed(1)}" x2="${w-padR}" y2="${y.toFixed(1)}" stroke="var(--bd)" stroke-width="1"/>
      <text x="${padL-4}" y="${(y+3).toFixed(1)}" font-size="8" fill="#8A9592" text-anchor="end">${t}</text>`;
  }).join('');

  const paths = visibleSeries.map(s=>{
    const coords = s.points.map(p=> [xFor(dates.indexOf(p.date)), yFor(p.val)]);
    const path = coords.map((c,i)=>(i===0?'M':'L')+c[0].toFixed(1)+','+c[1].toFixed(1)).join(' ');
    const dots = coords.map(c=>`<circle cx="${c[0].toFixed(1)}" cy="${c[1].toFixed(1)}" r="2.5" fill="${s.color}"/>`).join('');
    return `<path d="${path}" fill="none" stroke="${s.color}" stroke-width="2"/>${dots}`;
  }).join('');

  box.innerHTML = `<svg viewBox="0 0 ${w} ${h}" style="width:100%;max-width:320px" role="img" aria-label="Progress chart">
    ${gridlines}
    ${paths}
    <text x="${padL}" y="${h-4}" font-size="9" fill="#8A9592">1</text>
    <text x="${w-padR}" y="${h-4}" font-size="9" fill="#8A9592" text-anchor="end">${dates.length}</text>
  </svg>`;
}

// ============ EXPORT (Ctrl/Cmd+E) ============
function exportData(){
  const payload = { workout: state, routine: (typeof rtState!=='undefined' ? rtState : null) };
  const blob = new Blob([JSON.stringify(payload, null, 2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = `dashboard-backup-${todayStr()}.json`;
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
}
document.addEventListener('keydown', e=>{
  if((e.ctrlKey||e.metaKey) && e.key.toLowerCase()==='e'){ e.preventDefault(); exportData(); }
});

// ============ INIT ============
function renderAll(){
  if(!state.plans.length){
    document.getElementById('plan-bar').style.display='none';
    cardsGrid.innerHTML='';
    renderInsights();
    if(activeTab==='workout') openCreateModal();
    return;
  }
  if(!currentPlanId || !getCurrentPlan()) currentPlanId = mostRecentPlanId();
  renderPlanBar();
  renderCards();
  renderInsights();
}
</script>

<script>
/* =====================================================================
   ROUTINE
   ===================================================================== */
const RT_KEY = 'routineDashboardData_v1';
const RT_DOW = ['S','M','T','W','T','F','S'];
const RT_DOW_FULL = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];

let rtState = null;
let rtDate = todayStr();
let rtSub = 'today';
let rtEditMode = false;
let rtGran = 'weekly';
let rtOpenDetail = null;
let rtEditingBlockId = null;
let rtDraftDays = '1111111';

function rtSeed(){
  // Blank by default — no habit names ship in the file. Groups are just
  // generic time-of-day scaffolding; blocks are created by the user via
  // "Add block" and stored only in their own Firebase/localStorage data.
  const g = n => ({ id: uid(), name: n });
  return {
    groups: [g('Morning'), g('Day'), g('Evening')],
    blocks: [],
    log: {}
  };
}

function rtNormalize(d){
  if(!d || typeof d!=='object') d = {};
  if(!Array.isArray(d.groups)) d.groups = [];
  if(!Array.isArray(d.blocks)) d.blocks = [];
  if(!d.log || typeof d.log!=='object') d.log = {};
  d.blocks.forEach(b=>{
    if(typeof b.days!=='string' || b.days.length!==7) b.days = '1111111';
    if(typeof b.paused!=='boolean') b.paused = false;
    if(!b.type) b.type = 'check';
    if(b.target===undefined) b.target = null;
    if(b.role===undefined) b.role = null;
    if(b.link===undefined) b.link = null;
    if(typeof b.notePrompt!=='string') b.notePrompt = '';
    if(typeof b.since!=='string'){
      let first = null;
      Object.keys(d.log).forEach(dt=>{ if(d.log[dt] && d.log[dt][b.id] && (!first || dt<first)) first = dt; });
      b.since = first || todayStr();
    }
  });
  const groupIds = new Set(d.groups.map(g=>g.id));
  d.blocks.forEach(b=>{ if(!groupIds.has(b.groupId) && d.groups.length) b.groupId = d.groups[0].id; });
  Object.keys(d.log).forEach(k=>{
    if(!d.log[k] || typeof d.log[k]!=='object') delete d.log[k];
  });
  return d;
}

function rtLoad(){
  try{
    const raw = localStorage.getItem(RT_KEY);
    if(raw) return rtNormalize(JSON.parse(raw));
  }catch(e){ console.error('Failed to load routine', e); }
  return rtSeed();
}
function rtSave(){
  rtState.updatedAt = Date.now();
  localStorage.setItem(RT_KEY, JSON.stringify(rtState));
  rtCloudQueueSave();
}

rtState = rtLoad();

/* ---------- date helpers ---------- */
function rtShift(dateStr, n){
  const d = new Date(dateStr+'T00:00:00');
  d.setDate(d.getDate()+n);
  return toDateStr(d);
}
function rtDow(dateStr){ return new Date(dateStr+'T00:00:00').getDay(); }
function rtToMin(hhmm){
  if(!hhmm || hhmm.indexOf(':')<0) return null;
  const [h,m] = hhmm.split(':').map(Number);
  if(isNaN(h)||isNaN(m)) return null;
  return h*60+m;
}
function rtFromMin(mins){
  const m = Math.round(mins);
  const h = Math.floor(m/60)%24, mm = m%60;
  return String(h).padStart(2,'0')+':'+String(mm).padStart(2,'0');
}
function rtFmtDur(mins){
  const m = Math.round(mins);
  return Math.floor(m/60)+'h '+String(m%60).padStart(2,'0');
}

/* ---------- entries ---------- */
function rtEntry(date, blockId){
  const day = rtState.log[date];
  return (day && day[blockId]) || null;
}
function rtPatch(date, blockId, patch){
  const blk = rtState.blocks.find(b=>b.id===blockId);
  if(blk && blk.since && date < blk.since) blk.since = date;
  if(!rtState.log[date]) rtState.log[date] = {};
  const cur = rtState.log[date][blockId] || {};
  rtState.log[date][blockId] = Object.assign({}, cur, patch);
}
function rtWorkoutOn(date){
  for(const plan of state.plans){
    for(const card of plan.cards){
      if(card.logs && card.logs[date]) return card.name;
    }
  }
  return null;
}
function rtScheduled(block, date){
  if(block.paused) return false;
  return block.days.charAt(rtDow(date)) === '1';
}
function rtStatus(block, date){
  if(block.since && date < block.since) return 'na';
  if(!rtScheduled(block, date)) return 'na';
  if(block.link === 'workout') return rtWorkoutOn(date) ? 'done' : (date > todayStr() ? 'na' : 'missed');
  const e = rtEntry(date, block.id);
  if(e && e.skipped) return 'skipped';
  if(e && e.done) return 'done';
  if(date > todayStr()) return 'na';
  return 'missed';
}
function rtActiveBlocks(){ return rtState.blocks.filter(b=>!b.paused); }

function rtDayStats(date){
  let done=0, total=0;
  rtState.blocks.forEach(b=>{
    const s = rtStatus(b, date);
    if(s==='done'){ done++; total++; }
    else if(s==='missed'){ total++; }
  });
  return { done, total };
}
function rtDayComplete(date){
  const s = rtDayStats(date);
  return s.total>0 && s.done===s.total;
}
function rtStreak(){
  let cur = todayStr();
  if(!rtDayComplete(cur)) cur = rtShift(cur,-1);
  let n = 0, guard = 0;
  while(rtDayComplete(cur) && guard<400){ n++; cur = rtShift(cur,-1); guard++; }
  return n;
}
function rtSleepFor(date){
  const wakeB = rtState.blocks.find(b=>b.role==='wake');
  const bedB  = rtState.blocks.find(b=>b.role==='bed');
  if(!wakeB || !bedB) return null;
  const w = rtEntry(date, wakeB.id);
  const bd = rtEntry(rtShift(date,-1), bedB.id);
  if(!w || !w.time || !bd || !bd.time) return null;
  const wm = rtToMin(w.time), bm = rtToMin(bd.time);
  if(wm===null || bm===null) return null;
  let dur = bm >= 720 ? (1440 - bm + wm) : (wm - bm);
  if(dur <= 0 || dur > 1080) return null;
  return dur;
}

/* ---------- tabs ---------- */
let activeTab = 'routine';
function switchTab(name){
  activeTab = name;
  document.querySelectorAll('.tab-btn').forEach(b=> b.classList.toggle('active', b.dataset.tab===name));
  document.getElementById('pane-routine').classList.toggle('active', name==='routine');
  document.getElementById('pane-workout').classList.toggle('active', name==='workout');
  if(name==='workout' && !state.plans.length) openCreateModal();
}
document.querySelectorAll('.tab-btn').forEach(btn=>{
  btn.addEventListener('click', ()=> switchTab(btn.dataset.tab));
});
document.querySelectorAll('.rt-subtab').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    rtSub = btn.dataset.sub;
    document.querySelectorAll('.rt-subtab').forEach(b=> b.classList.toggle('active', b.dataset.sub===rtSub));
    document.getElementById('rt-today-view').style.display = rtSub==='today' ? '' : 'none';
    document.getElementById('rt-stats-view').style.display = rtSub==='stats' ? '' : 'none';
    rtRenderAll();
  });
});

/* ---------- day nav ---------- */
document.getElementById('rt-prev').addEventListener('click', ()=>{ rtDate = rtShift(rtDate,-1); rtRenderToday(); });
document.getElementById('rt-next').addEventListener('click', ()=>{ rtDate = rtShift(rtDate,1); rtRenderToday(); });
document.getElementById('rt-today-btn').addEventListener('click', ()=>{ rtDate = todayStr(); rtRenderToday(); });
document.getElementById('rt-edit-toggle').addEventListener('click', ()=>{
  rtEditMode = !rtEditMode;
  rtRenderToday();
});
document.getElementById('rt-add-group').addEventListener('click', ()=>{
  rtState.groups.push({ id: uid(), name: 'New group' });
  rtSave(); rtRenderToday();
});

/* ---------- context menu ---------- */
function rtCloseMenu(){
  const m = document.querySelector('.rt-menu');
  if(m) m.remove();
}
document.addEventListener('click', e=>{
  if(!e.target.closest || !e.target.closest('.rt-menu')) rtCloseMenu();
}, true);

function rtOpenMenu(anchor, items){
  rtCloseMenu();
  const m = document.createElement('div'); m.className='rt-menu';
  items.forEach(it=>{
    const b = document.createElement('button');
    b.textContent = it.label;
    if(it.danger) b.className='danger';
    b.addEventListener('click', ev=>{ ev.stopPropagation(); rtCloseMenu(); it.run(); });
    m.appendChild(b);
  });
  document.body.appendChild(m);
  const r = anchor.getBoundingClientRect();
  m.style.top = (window.scrollY + r.bottom + 4) + 'px';
  m.style.left = Math.max(8, window.scrollX + r.right - m.offsetWidth) + 'px';
}

/* ---------- today view ---------- */
function rtRenderToday(){
  const label = document.getElementById('rt-daylabel');
  const d = new Date(rtDate+'T00:00:00');
  const isToday = rtDate === todayStr();
  label.textContent = isToday ? 'Today · ' + d.toLocaleDateString('en-US',{month:'short',day:'numeric'})
                              : d.toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'});

  const editBtn = document.getElementById('rt-edit-toggle');
  editBtn.classList.toggle('on', rtEditMode);
  document.getElementById('rt-add-group').style.display = rtEditMode ? '' : 'none';
  document.getElementById('rt-next').disabled = rtDate >= todayStr();

  // metrics
  const st = rtDayStats(rtDate);
  const sleep = rtSleepFor(rtDate);
  const wakeB = rtState.blocks.find(b=>b.role==='wake');
  const wakeE = wakeB ? rtEntry(rtDate, wakeB.id) : null;
  const mEl = document.getElementById('rt-metrics');
  mEl.innerHTML = [
    ['Done', st.done + ' / ' + st.total],
    ['Slept', sleep!==null ? rtFmtDur(sleep) : '—'],
    ['Woke', (wakeE && wakeE.time) ? wakeE.time : '—'],
    ['Streak', rtStreak() + (rtStreak()===1?' day':' days')]
  ].map(([l,v])=>`<div class="rt-metric"><div class="l">${l}</div><div class="v">${escapeHtml(String(v))}</div></div>`).join('');

  // first run: no blocks anywhere yet — invite setup instead of showing empty groups
  if(!rtState.blocks.length && !rtEditMode){
    rtEditMode = true;
    editBtn.classList.add('on');
    document.getElementById('rt-add-group').style.display = '';
  }

  // groups
  const wrap = document.getElementById('rt-groups');
  wrap.innerHTML = '';
  if(!rtState.blocks.length){
    const intro = document.createElement('div'); intro.className='empty-hint'; intro.style.marginBottom='10px';
    intro.textContent = 'This routine is empty — use "Add block" below each group to build your own.';
    wrap.appendChild(intro);
  }
  rtState.groups.forEach(group=>{
    const hdr = document.createElement('div'); hdr.className='rt-group-hdr';
    const nameInp = document.createElement('input');
    nameInp.className='rt-group-name'; nameInp.type='text'; nameInp.value=group.name;
    nameInp.readOnly = !rtEditMode;
    nameInp.addEventListener('change', ()=>{ group.name = nameInp.value.trim()||'Group'; rtSave(); });
    hdr.appendChild(nameInp);
    if(rtEditMode){
      const del = document.createElement('button'); del.className='icon-btn'; del.title='Delete group';
      del.innerHTML='<i class="ti ti-trash" style="font-size:12px"></i>';
      del.addEventListener('click', ()=>{
        if(rtState.blocks.some(b=>b.groupId===group.id)){ alert('Move or delete this group\u2019s blocks first.'); return; }
        rtState.groups = rtState.groups.filter(g=>g.id!==group.id);
        rtSave(); rtRenderToday();
      });
      hdr.appendChild(del);
    }
    wrap.appendChild(hdr);

    const blocks = rtState.blocks.filter(b=>b.groupId===group.id);
    const rows = document.createElement('div');
    rows.className = 'rt-rows' + (blocks.length ? '' : ' empty');
    rows.dataset.group = group.id;
    if(!blocks.length) rows.textContent = 'No blocks in this group yet.';
    blocks.forEach(block=> rows.appendChild(rtRowEl(block)));
    wrap.appendChild(rows);
    rtAttachDrop(rows);

    if(rtEditMode){
      const add = document.createElement('button'); add.className='rt-addblock';
      add.innerHTML='<i class="ti ti-plus" style="font-size:12px;vertical-align:-2px;margin-right:4px"></i>Add block';
      add.addEventListener('click', ()=> rtOpenBlockEditor(null, group.id));
      wrap.appendChild(add);
    }
  });
}

function rtRowEl(block){
  const row = document.createElement('div');
  row.className = 'rt-row';
  row.dataset.block = block.id;
  const status = rtStatus(block, rtDate);
  const scheduled = rtScheduled(block, rtDate);
  if(!scheduled) row.classList.add('na');

  if(rtEditMode){
    const h = document.createElement('span'); h.className='rt-handle';
    h.innerHTML='<i class="ti ti-grip-vertical"></i>';
    rtAttachDrag(h, row);
    row.appendChild(h);
  }

  // check circle
  const chk = document.createElement('button');
  chk.className = 'rt-check' + (status==='done'?' done':'') + (status==='skipped'?' skipped':'') + (block.link?' linked':'');
  chk.innerHTML = status==='done' ? '<i class="ti ti-check"></i>' : (status==='skipped' ? '<i class="ti ti-minus"></i>' : '');
  chk.title = block.link ? 'Set automatically from the workout tab' : 'Toggle done';
  if(block.link){
    chk.addEventListener('click', ()=> switchTab('workout'));
  }else{
    chk.addEventListener('click', ()=>{
      const e = rtEntry(rtDate, block.id);
      const nowDone = !(e && e.done);
      rtPatch(rtDate, block.id, { done: nowDone, skipped:false });
      rtSave(); rtRenderToday();
    });
  }
  row.appendChild(chk);

  // name
  const name = document.createElement('span'); name.className='rt-name';
  name.textContent = block.name; name.title = block.name;
  if(block.link==='workout'){
    const w = rtWorkoutOn(rtDate);
    if(w){ const s=document.createElement('span'); s.className='sub'; s.textContent='— '+w+' logged'; name.appendChild(s); }
  }
  if(block.paused){ const s=document.createElement('span'); s.className='sub'; s.textContent='— paused'; name.appendChild(s); }
  else if(!scheduled){ const s=document.createElement('span'); s.className='sub'; s.textContent='— not scheduled'; name.appendChild(s); }
  row.appendChild(name);

  // type control
  if(scheduled && !block.link){
    if(block.type==='time'){
      if(block.target){
        const t = document.createElement('span'); t.className='rt-hint';
        t.textContent = 'target ' + block.target;
        row.appendChild(t);
      }
      const inp = document.createElement('input'); inp.type='time'; inp.className='rt-time';
      const e = rtEntry(rtDate, block.id);
      inp.value = (e && e.time) || '';
      inp.addEventListener('change', ()=>{
        rtPatch(rtDate, block.id, { time: inp.value, done: !!inp.value, skipped:false });
        rtSave(); rtRenderToday();
      });
      row.appendChild(inp);
    } else if(block.type==='duration'){
      const e = rtEntry(rtDate, block.id);
      let val = (e && typeof e.minutes==='number') ? e.minutes : 0;
      const st = document.createElement('div'); st.className='stepper';
      const minus=document.createElement('button'); minus.textContent='−';
      const box=document.createElement('input'); box.type='text'; box.readOnly=true; box.value=val+'m'; box.style.width='44px';
      const plus=document.createElement('button'); plus.textContent='+';
      const commit = ()=>{
        box.value = val+'m';
        rtPatch(rtDate, block.id, { minutes: val, done: val>0, skipped:false });
        rtSave();
        rtRenderMetricsOnly();
      };
      minus.addEventListener('click', ()=>{ val=Math.max(0,val-5); commit(); });
      plus.addEventListener('click', ()=>{ val=Math.min(600,val+5); commit(); });
      st.appendChild(minus); st.appendChild(box); st.appendChild(plus);
      if(block.target){
        const t=document.createElement('span'); t.className='rt-hint'; t.textContent='target '+block.target+'m';
        row.appendChild(t);
      }
      row.appendChild(st);
    } else if(block.type==='note'){
      const e = rtEntry(rtDate, block.id);
      const inp = document.createElement('input'); inp.type='text'; inp.className='rt-note';
      inp.placeholder = block.notePrompt || 'Add a note…';
      inp.value = (e && e.note) || '';
      inp.addEventListener('change', ()=>{
        const v = inp.value.trim();
        rtPatch(rtDate, block.id, { note: v, done: v!=='' ? true : false, skipped:false });
        rtSave(); rtRenderToday();
      });
      row.appendChild(inp);
    } else if(status==='done'){
      const p=document.createElement('span'); p.className='rt-pill'; p.textContent='Done';
      row.appendChild(p);
    } else if(status==='skipped'){
      const p=document.createElement('span'); p.className='rt-pill grey'; p.textContent='Skipped';
      row.appendChild(p);
    }
  }

  // menu
  const dots = document.createElement('button'); dots.className='icon-btn';
  dots.innerHTML='<i class="ti ti-dots" style="font-size:14px"></i>';
  dots.addEventListener('click', ev=>{
    ev.stopPropagation();
    const items = [];
    if(!block.link){
      const e = rtEntry(rtDate, block.id);
      items.push({
        label: (e && e.skipped) ? 'Un-skip today' : 'Skip today',
        run: ()=>{
          const cur = rtEntry(rtDate, block.id);
          const skipping = !(cur && cur.skipped);
          rtPatch(rtDate, block.id, { skipped: skipping, done:false });
          rtSave(); rtRenderToday();
        }
      });
    }
    items.push({ label:'Edit block', run: ()=> rtOpenBlockEditor(block.id, block.groupId) });
    rtOpenMenu(dots, items);
  });
  row.appendChild(dots);

  return row;
}

function rtRenderMetricsOnly(){
  const st = rtDayStats(rtDate);
  const sleep = rtSleepFor(rtDate);
  const wakeB = rtState.blocks.find(b=>b.role==='wake');
  const wakeE = wakeB ? rtEntry(rtDate, wakeB.id) : null;
  const mEl = document.getElementById('rt-metrics');
  mEl.innerHTML = [
    ['Done', st.done + ' / ' + st.total],
    ['Slept', sleep!==null ? rtFmtDur(sleep) : '—'],
    ['Woke', (wakeE && wakeE.time) ? wakeE.time : '—'],
    ['Streak', rtStreak() + (rtStreak()===1?' day':' days')]
  ].map(([l,v])=>`<div class="rt-metric"><div class="l">${l}</div><div class="v">${escapeHtml(String(v))}</div></div>`).join('');
}

/* ---------- drag reorder ---------- */
let rtDragRow = null;
function rtAttachDrag(handle, row){
  handle.addEventListener('pointerdown', e=>{
    e.preventDefault();
    rtDragRow = row;
    row.classList.add('dragging');
    handle.setPointerCapture(e.pointerId);
  });
  handle.addEventListener('pointermove', e=>{
    if(!rtDragRow) return;
    const under = document.elementFromPoint(e.clientX, e.clientY);
    if(!under) return;
    const target = under.closest ? under.closest('.rt-row') : null;
    const container = under.closest ? under.closest('.rt-rows') : null;
    if(target && target!==rtDragRow && target.parentNode){
      const r = target.getBoundingClientRect();
      const before = e.clientY < r.top + r.height/2;
      target.parentNode.insertBefore(rtDragRow, before ? target : target.nextSibling);
    } else if(container && !container.contains(rtDragRow) && !container.querySelector('.rt-row')){
      container.classList.remove('empty');
      container.textContent = '';
      container.appendChild(rtDragRow);
    }
  });
  const finish = ()=>{
    if(!rtDragRow) return;
    rtDragRow.classList.remove('dragging');
    rtDragRow = null;
    rtCommitOrder();
  };
  handle.addEventListener('pointerup', finish);
  handle.addEventListener('pointercancel', finish);
}
function rtAttachDrop(container){ /* container is a valid drop target via pointermove */ }

function rtCommitOrder(){
  const ordered = [];
  document.querySelectorAll('#rt-groups .rt-rows').forEach(cont=>{
    const gid = cont.dataset.group;
    cont.querySelectorAll('.rt-row').forEach(r=>{
      const b = rtState.blocks.find(x=>x.id===r.dataset.block);
      if(b){ b.groupId = gid; ordered.push(b); }
    });
  });
  rtState.blocks.forEach(b=>{ if(!ordered.includes(b)) ordered.push(b); });
  rtState.blocks = ordered;
  rtSave();
  rtRenderToday();
}

/* ---------- block editor ---------- */
const rtBlockOverlay = document.getElementById('rt-block-overlay');
function rtRenderDayPills(){
  const wrap = document.getElementById('rt-b-days');
  wrap.innerHTML='';
  for(let i=0;i<7;i++){
    const b=document.createElement('button');
    b.textContent = RT_DOW[i];
    b.title = RT_DOW_FULL[i];
    if(rtDraftDays.charAt(i)==='1') b.classList.add('on');
    b.addEventListener('click', ()=>{
      const arr = rtDraftDays.split('');
      arr[i] = arr[i]==='1' ? '0' : '1';
      rtDraftDays = arr.join('');
      rtRenderDayPills();
    });
    wrap.appendChild(b);
  }
}
function rtSyncEditorFields(){
  const type = document.getElementById('rt-b-type').value;
  const tw = document.getElementById('rt-b-target-wrap');
  const rw = document.getElementById('rt-b-role-wrap');
  const lw = document.getElementById('rt-b-link-wrap');
  const tl = document.getElementById('rt-b-target-label');
  const ti = document.getElementById('rt-b-target');
  if(type==='time'){ tw.style.display=''; tl.textContent='Target time (HH:MM)'; ti.placeholder='06:30'; rw.style.display=''; lw.style.display='none'; }
  else if(type==='duration'){ tw.style.display=''; tl.textContent='Target minutes'; ti.placeholder='20'; rw.style.display='none'; lw.style.display='none'; }
  else if(type==='check'){ tw.style.display='none'; rw.style.display='none'; lw.style.display=''; }
  else { tw.style.display='none'; rw.style.display='none'; lw.style.display='none'; }
}
document.getElementById('rt-b-type').addEventListener('change', rtSyncEditorFields);

function rtOpenBlockEditor(blockId, groupId){
  rtEditingBlockId = blockId;
  const block = blockId ? rtState.blocks.find(b=>b.id===blockId) : null;
  document.getElementById('rt-block-title').textContent = block ? 'Edit block' : 'Add block';
  document.getElementById('rt-b-name').value = block ? block.name : '';
  const gSel = document.getElementById('rt-b-group');
  gSel.innerHTML = rtState.groups.map(g=>`<option value="${g.id}">${escapeHtml(g.name)}</option>`).join('');
  gSel.value = block ? block.groupId : (groupId || (rtState.groups[0] && rtState.groups[0].id));
  document.getElementById('rt-b-type').value = block ? block.type : 'check';
  document.getElementById('rt-b-target').value = block && block.target!==null ? block.target : '';
  document.getElementById('rt-b-role').value = block && block.role ? block.role : '';
  document.getElementById('rt-b-link').value = block && block.link ? block.link : '';
  document.getElementById('rt-b-note').value = block ? block.notePrompt : '';
  rtDraftDays = block ? block.days : '1111111';
  rtRenderDayPills();
  rtSyncEditorFields();
  document.getElementById('rt-b-delete').style.display = block ? '' : 'none';
  const pauseBtn = document.getElementById('rt-b-pause');
  pauseBtn.style.display = block ? '' : 'none';
  pauseBtn.textContent = (block && block.paused) ? 'Resume' : 'Pause';
  rtBlockOverlay.classList.add('open');
}
document.getElementById('rt-b-cancel').addEventListener('click', ()=> rtBlockOverlay.classList.remove('open'));
document.getElementById('rt-b-pause').addEventListener('click', ()=>{
  const b = rtState.blocks.find(x=>x.id===rtEditingBlockId);
  if(!b) return;
  b.paused = !b.paused;
  rtSave(); rtBlockOverlay.classList.remove('open'); rtRenderToday();
});
document.getElementById('rt-b-delete').addEventListener('click', ()=>{
  const b = rtState.blocks.find(x=>x.id===rtEditingBlockId);
  if(!b) return;
  if(!confirm(`Delete "${b.name}"? Its logged history stays in your data but it will no longer appear.`)) return;
  rtState.blocks = rtState.blocks.filter(x=>x.id!==rtEditingBlockId);
  rtSave(); rtBlockOverlay.classList.remove('open'); rtRenderAll();
});
document.getElementById('rt-b-save').addEventListener('click', ()=>{
  const name = document.getElementById('rt-b-name').value.trim();
  if(!name){ alert('Give the block a name.'); return; }
  const type = document.getElementById('rt-b-type').value;
  const groupId = document.getElementById('rt-b-group').value;
  const rawTarget = document.getElementById('rt-b-target').value.trim();
  let target = null;
  if(type==='time' && rawTarget) target = rawTarget;
  if(type==='duration' && rawTarget) target = parseInt(rawTarget)||null;
  const role = type==='time' ? (document.getElementById('rt-b-role').value || null) : null;
  const link = type==='check' ? (document.getElementById('rt-b-link').value || null) : null;
  const notePrompt = document.getElementById('rt-b-note').value.trim();
  const days = rtDraftDays.indexOf('1')<0 ? '1111111' : rtDraftDays;

  if(role){
    rtState.blocks.forEach(b=>{ if(b.id!==rtEditingBlockId && b.role===role) b.role=null; });
  }

  if(rtEditingBlockId){
    const b = rtState.blocks.find(x=>x.id===rtEditingBlockId);
    Object.assign(b, { name, type, groupId, target, role, link, notePrompt, days });
  }else{
    rtState.blocks.push({ id: uid(), name, type, groupId, target, role, link, notePrompt, days, paused:false, since: todayStr() });
  }
  rtSave();
  rtBlockOverlay.classList.remove('open');
  rtRenderAll();
});

document.querySelectorAll('#rt-gran button').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    rtGran = btn.dataset.g;
    document.querySelectorAll('#rt-gran button').forEach(b=> b.classList.toggle('active', b.dataset.g===rtGran));

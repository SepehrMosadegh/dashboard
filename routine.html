<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Routine Dashboard</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.44.0/tabler-icons.min.css">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#F3F5F4;--s0:#E7EBE9;--s1:#FFFFFF;--s2:#FBFCFC;
  --bd:#DFE4E2;--bds:#C7CFCC;--bda:#0E9488;
  --tp:#122421;--ts:#43524F;--tm:#8A9592;
  --font:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
}
.sync-box{display:flex;align-items:center;justify-content:flex-end;gap:8px;padding:2px 2px 0}
.sync-status{font-size:11px;color:var(--tm);font-family:var(--font);white-space:nowrap}
.sync-status.synced{color:#0E9488}
.sync-status.syncing{color:#854F0B}
.sync-status.err{color:#B3261E}
.sync-btn{font-size:11px;font-family:var(--font);border:1px solid var(--bd);background:var(--s1);color:var(--tp);padding:5px 12px;border-radius:6px;cursor:pointer}
.sync-btn:hover{background:var(--s0)}
body{font-family:var(--font);background:var(--bg);padding:1.5rem;color:var(--tp);line-height:1.4}
.dash{max-width:980px;margin:0 auto;display:flex;flex-direction:column;gap:.9rem}
input,select,button,textarea{font-family:var(--font);color:var(--tp)}
input[type=text],input[type=number],input[type=date],input[type=time],select,textarea{
  border:0.5px solid var(--bds);border-radius:6px;background:var(--s2);padding:4px 6px;outline:none;font-size:13px;
}
input[type=text]:focus,input[type=number]:focus,input[type=date]:focus,input[type=time]:focus,select:focus,textarea:focus{border-color:var(--bda);box-shadow:0 0 0 1px var(--bda)}
input[type=number]::-webkit-inner-spin-button,input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
input[type=number]{-moz-appearance:textfield}
button{border:0.5px solid var(--bds);border-radius:6px;background:var(--s1);cursor:pointer;color:var(--ts);transition:background .12s}
button:hover{background:var(--s0)}
button:active{transform:scale(.98)}
button:disabled{opacity:.4;cursor:default}
button:disabled:hover{background:var(--s1)}
.icon-btn{width:28px;height:28px;display:flex;align-items:center;justify-content:center;padding:0;flex-shrink:0}
.plain-input{border:none;background:transparent;padding:0}
.plain-input:focus{box-shadow:none;border:none}

/* TOP TABS */
.tabbar{display:flex;align-items:center;gap:4px;border-bottom:0.5px solid var(--bd);padding-bottom:0}
.tab{background:none;border:none;border-bottom:2px solid transparent;border-radius:0;padding:8px 14px;font-size:14px;color:var(--tm);margin-bottom:-1px}
.tab:hover{background:none;color:var(--ts)}
.tab.active{color:var(--tp);border-bottom-color:var(--bda);font-weight:500}
.tab .ti{font-size:15px;vertical-align:-2px;margin-right:6px}
.tabbar .spacer{flex:1}
.tabbar a.tab{text-decoration:none;display:inline-block}

/* PLAN BANNER */
.plan-bar{background:var(--s1);border:0.5px solid var(--bd);border-radius:10px;padding:.6rem .9rem;display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:12px;color:var(--ts)}
.plan-bar-left{display:flex;align-items:center;gap:8px;flex:1;min-width:0}
.plan-select{border:none;background:transparent;font-weight:500;color:var(--tp);font-size:13px;flex:1;min-width:0;padding-right:18px;text-overflow:ellipsis}
.plan-select:focus{box-shadow:none}

/* INSIGHTS */
.card{background:var(--s1);border:0.5px solid var(--bd);border-radius:12px;padding:1.1rem 1.3rem;min-width:0}
.eyebrow{font-size:11px;font-weight:500;color:var(--tm);text-transform:uppercase;letter-spacing:.06em}
.insights-hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;flex-wrap:wrap;gap:8px}
.insights-grid{display:grid;grid-template-columns:1fr 1fr;gap:1.5rem;align-items:stretch}
.insights-col{display:flex;flex-direction:column;min-height:0}
.chart-box{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:130px;border:1px dashed var(--bds);border-radius:8px;color:var(--tm);font-size:12px;text-align:center;padding:8px 4px;overflow:auto}
@media(max-width:640px){.insights-grid{grid-template-columns:1fr}}
.prog-label{display:flex;justify-content:space-between;font-size:12px;margin-bottom:3px}
.prog-track{height:8px;background:var(--s0);border-radius:4px;overflow:hidden;margin-bottom:10px}
.prog-fill{height:100%;background:var(--bda);border-radius:4px;transition:width .2s}
.motivate{background:#E4F3F1;border-radius:8px;padding:10px 12px;font-size:12px;color:#0B5D54;line-height:1.5;margin-top:6px}
.chart-legend{display:flex;flex-wrap:wrap;gap:6px 12px;margin-top:8px}
.legend-item{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--ts);cursor:pointer;user-select:none;background:none;border:none;padding:0}
.legend-item.static{cursor:default}
.legend-item .dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.legend-item.off{color:var(--tm);text-decoration:line-through;opacity:.55}
.cal-wrap{display:flex;flex-direction:column;height:100%;width:100%;max-width:320px}
.cal-dow-row{display:grid;grid-template-columns:repeat(7,1fr);flex-shrink:0;margin-bottom:2px}
.cal-dow{font-size:9px;color:var(--tm);text-align:center}
.cal-weeks{flex:1;display:grid;grid-template-columns:repeat(7,1fr);grid-template-rows:repeat(6,1fr);gap:2px;min-height:0}
.cal-cell{border-radius:3px;background:var(--s2,rgba(0,0,0,.04));border:1px solid var(--bds);font-size:9px;display:flex;align-items:center;justify-content:center;color:var(--tm)}
.cal-cell.empty{visibility:hidden}
.cal-cell.filled{background:var(--bda);color:#fff;border-color:transparent}
.cal-cell.out-of-range{opacity:.35}

/* DAY CARDS */
.cards-grid{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:1rem}
@media(max-width:640px){.cards-grid{grid-auto-flow:row;grid-auto-columns:unset;grid-template-columns:1fr}}
.day-card-hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.day-name-label{font-weight:500;font-size:15px;width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.date-row{display:flex;align-items:center;gap:6px;margin-bottom:12px}
.date-row input[type=date]{flex:1;font-size:12px;height:30px}
.log-btn{height:30px;padding:0 12px;font-size:12px;white-space:nowrap;font-weight:500}
.log-btn.is-logged{border-color:var(--bda);color:var(--bda);background:#E4F3F1}
.col-hdr{display:grid;grid-template-columns:26px 26px 1fr 92px;gap:6px;font-size:10px;color:var(--tm);padding:0 0 4px;text-transform:uppercase;letter-spacing:.03em}
.ex-row{display:grid;grid-template-columns:26px 26px 1fr 92px;gap:6px;align-items:center;padding:7px 0;border-bottom:0.5px solid var(--bd)}
.static-val{font-size:13px;text-align:center;color:var(--ts)}
.static-name{font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.stepper{display:flex;align-items:center;justify-content:flex-end;gap:2px}
.stepper button{width:20px;height:26px;padding:0;font-size:14px;line-height:1;flex-shrink:0}
.stepper input{width:34px;height:26px;text-align:center;font-size:12px;padding:0}
.empty-hint{font-size:12px;color:var(--tm);padding:.5rem 0}

/* MODAL */
.overlay{position:fixed;inset:0;background:rgba(18,36,33,.35);display:none;align-items:flex-start;justify-content:center;padding:4vh 1rem;z-index:500;overflow:auto}
.overlay.open{display:flex}
.modal{background:var(--s1);border-radius:12px;padding:1.5rem;max-width:560px;width:100%;box-shadow:0 8px 30px rgba(0,0,0,.15)}
.modal h2{font-size:16px;font-weight:500;margin-bottom:1rem}
.field{margin-bottom:12px}
.field label{display:block;font-size:12px;color:var(--ts);margin-bottom:4px}
.field input{width:100%;height:34px}
.field-row{display:flex;gap:10px}
.field-row .field{flex:1}
.setup-card-block{border:0.5px solid var(--bd);border-radius:8px;padding:12px;margin-bottom:10px;background:var(--s2)}
.setup-card-top{display:flex;gap:10px;margin-bottom:10px;align-items:center}
.setup-card-top input[type=text]{flex:2;height:32px}
.setup-card-top input[type=number]{flex:1;height:32px}
.setup-ex-row{display:flex;gap:6px;align-items:center;margin-bottom:6px}
.setup-ex-row input[type=text]{flex:1;height:30px}
.setup-ex-row input[type=number]{width:52px;height:30px;text-align:center}
.setup-ex-row select{width:84px;height:30px}
.setup-add-ex{font-size:11px;height:28px;padding:0 8px;border-style:dashed}
.add-day-block-btn{width:100%;border-style:dashed;font-size:13px;height:36px}
.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:1rem}
.modal-actions button{height:34px;padding:0 14px;font-size:13px}
.primary-btn{background:var(--bda);color:#fff;border-color:var(--bda)}
.primary-btn:hover{background:#0B7B71}
.hint{font-size:11px;color:var(--tm);margin-top:4px}

/* ============ ROUTINE ============ */
.rt-topbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.rt-datenav{display:flex;align-items:center;gap:4px;background:var(--s1);border:0.5px solid var(--bd);border-radius:8px;padding:3px 4px}
.rt-datenav .lbl{font-size:13px;font-weight:500;min-width:112px;text-align:center}
.rt-subtabs{display:flex;gap:4px;margin-left:auto}
.rt-pill{font-size:12px;padding:6px 13px;border-radius:6px;border:0.5px solid var(--bd);background:var(--s1);color:var(--ts)}
.rt-pill.on{background:#E4F3F1;border-color:var(--bda);color:#0B5D54;font-weight:500}
.rt-metrics{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
@media(max-width:640px){.rt-metrics{grid-template-columns:repeat(2,minmax(0,1fr))}}
.rt-metric{background:var(--s1);border:0.5px solid var(--bd);border-radius:10px;padding:.7rem .85rem}
.rt-metric .k{font-size:11px;color:var(--tm);margin-bottom:3px}
.rt-metric .v{font-size:21px;font-weight:500;line-height:1.1}
.rt-group{margin-top:.2rem}
.rt-group-hdr{display:flex;align-items:center;gap:6px;margin:0 0 6px 2px}
.rt-group-name{font-size:11px;font-weight:500;color:var(--tm);text-transform:uppercase;letter-spacing:.06em;border:none;background:transparent;padding:2px 0;max-width:220px}
.rt-group-name:focus{box-shadow:none;border-bottom:1px solid var(--bda)}
.rt-list{background:var(--s1);border:0.5px solid var(--bd);border-radius:12px;overflow:hidden}
.rt-row{display:flex;align-items:flex-start;gap:10px;padding:11px 14px;border-bottom:0.5px solid var(--bd);background:var(--s1)}
.rt-row:last-child{border-bottom:none}
.rt-row.skipped{opacity:.45}
.rt-row.dragging{opacity:.35}
.rt-row.drop-target{box-shadow:inset 0 2px 0 var(--bda)}
.rt-handle{cursor:grab;color:var(--tm);font-size:16px;touch-action:none;padding-top:2px}
.rt-tick{background:none;border:none;padding:0;font-size:19px;color:var(--tm);line-height:1;flex-shrink:0;margin-top:1px}
.rt-tick:hover{background:none;color:var(--bda)}
.rt-tick.done{color:var(--bda)}
.rt-main{flex:1;min-width:0}
.rt-name{font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rt-sub{font-size:11px;color:var(--tm);margin-top:2px}
.rt-ctrl{display:flex;align-items:center;gap:6px;flex-shrink:0}
.rt-ctrl input[type=time]{height:28px;font-size:12px;width:96px}
.rt-note{width:100%;margin-top:7px;height:30px;font-size:12px}
.rt-badge{font-size:11px;padding:3px 9px;border-radius:6px;background:#E4F3F1;color:#0B5D54;white-space:nowrap}
.rt-badge.grey{background:var(--s0);color:var(--tm)}
.rt-mini{width:26px;height:26px;font-size:13px;display:flex;align-items:center;justify-content:center;padding:0;flex-shrink:0}
.rt-add-row{width:100%;border:none;border-top:0.5px dashed var(--bds);border-radius:0;font-size:12px;height:34px;color:var(--tm);background:var(--s2)}
.rt-daypills{display:flex;gap:5px;flex-wrap:wrap}
.rt-daypill{width:34px;height:30px;font-size:12px;padding:0;display:flex;align-items:center;justify-content:center}
.rt-daypill.on{background:#E4F3F1;border-color:var(--bda);color:#0B5D54;font-weight:500}
.rt-matrix{display:grid;gap:5px;align-items:center;margin-bottom:5px}
.rt-mlabel{font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.rt-mlabel.total{font-weight:500}
.rt-cell{height:24px;border-radius:3px;background:var(--bda)}
.rt-cell.na{background:transparent;border:1px dashed var(--bd)}
.rt-cell.zero{background:var(--s0)}
.rt-mpct{font-size:11px;color:var(--ts);text-align:right;font-variant-numeric:tabular-nums}
.rt-axis{font-size:9px;color:var(--tm);text-align:center;overflow:hidden;white-space:nowrap}
.rt-scale{display:flex;align-items:center;gap:7px;margin-top:14px;font-size:11px;color:var(--tm);flex-wrap:wrap}
.rt-swatch{width:22px;height:11px;border-radius:2px;background:var(--bda)}
</style>
</head>
<body>
<div class="dash">
  <div class="sync-box">
    <span id="sync-status" class="sync-status">Not signed in</span>
    <button id="sync-btn" class="sync-btn">Sign in</button>
  </div>

  <div class="tabbar">
    <button class="tab active" id="tab-btn-routine"><i class="ti ti-sun"></i>Routine</button>
    <button class="tab" id="tab-btn-workout"><i class="ti ti-barbell"></i>Workout</button>
    <span class="spacer"></span>
    <a class="tab" href="Planner.html"><i class="ti ti-layout-grid"></i>Planner</a>
  </div>

  <!-- ============ ROUTINE TAB ============ -->
  <div id="pane-routine">
    <div class="rt-topbar" style="margin-bottom:.9rem">
      <div class="rt-datenav" id="rt-datenav">
        <button class="icon-btn" id="rt-prev" title="Previous day"><i class="ti ti-chevron-left" style="font-size:14px"></i></button>
        <span class="lbl" id="rt-date-label"></span>
        <button class="icon-btn" id="rt-next" title="Next day"><i class="ti ti-chevron-right" style="font-size:14px"></i></button>
        <button class="rt-pill" id="rt-today-btn" style="margin-left:2px">Today</button>
      </div>
      <div class="rt-subtabs">
        <button class="rt-pill on" id="rt-sub-today">Today</button>
        <button class="rt-pill" id="rt-sub-stats">Stats</button>
        <button class="rt-pill" id="rt-edit-toggle" style="margin-left:6px"><i class="ti ti-pencil" style="font-size:12px;vertical-align:-2px;margin-right:4px"></i>Edit</button>
      </div>
    </div>

    <div id="rt-today-view">
      <div class="rt-metrics" id="rt-metrics" style="margin-bottom:1rem"></div>
      <div id="rt-groups"></div>
      <button class="add-day-block-btn" id="rt-add-group" style="margin-top:.9rem;display:none"><i class="ti ti-plus" style="font-size:13px;vertical-align:-2px;margin-right:5px"></i>Add group</button>
    </div>

    <div id="rt-stats-view" style="display:none">
      <div class="rt-topbar" style="margin-bottom:1rem">
        <button class="rt-pill" data-range="daily">Daily</button>
        <button class="rt-pill on" data-range="weekly">Weekly</button>
        <button class="rt-pill" data-range="monthly">Monthly</button>
        <span class="hint" id="rt-range-hint" style="margin:0 0 0 auto"></span>
      </div>
      <div class="rt-metrics" id="rt-stat-metrics" style="margin-bottom:1.3rem"></div>
      <div class="card">
        <div class="insights-hdr"><span class="eyebrow">Completion</span></div>
        <div id="rt-matrix"></div>
        <div class="rt-scale">
          <span>0%</span>
          <div style="display:flex;gap:3px">
            <div class="rt-swatch zero" style="background:var(--s0)"></div>
            <div class="rt-swatch" style="opacity:.35"></div>
            <div class="rt-swatch" style="opacity:.6"></div>
            <div class="rt-swatch" style="opacity:.8"></div>
            <div class="rt-swatch"></div>
          </div>
          <span>100%</span>
          <span style="margin-left:10px">Dashed = not scheduled</span>
        </div>
      </div>
      <div class="card" style="margin-top:.9rem">
        <div class="insights-hdr"><span class="eyebrow">By weekday</span></div>
        <div id="rt-weekday"></div>
      </div>
    </div>
  </div>

  <!-- ============ WORKOUT TAB ============ -->
  <div id="pane-workout" style="display:none">
    <div class="plan-bar" id="plan-bar" style="display:none">
      <div class="plan-bar-left">
        <i class="ti ti-target-arrow" style="font-size:14px;color:var(--tm)" aria-hidden="true"></i>
        <select class="plan-select" id="plan-select"></select>
      </div>
      <div style="display:flex;gap:4px">
        <button class="icon-btn" id="edit-plan-btn" title="Edit plan"><i class="ti ti-pencil" style="font-size:13px"></i></button>
      </div>
    </div>

    <div class="card" style="margin-top:.9rem">
      <div class="insights-hdr">
        <span class="eyebrow">Progress tracker</span>
        <select id="chart-select" style="height:26px;font-size:11px"></select>
      </div>
      <div class="insights-grid">
        <div class="insights-col">
          <div id="progress-bars"></div>
          <div class="motivate" id="motivate-text"></div>
        </div>
        <div class="insights-col chart-col">
          <div class="chart-box" id="chart-box">pick a workout day to see progress</div>
          <div class="chart-legend" id="chart-legend"></div>
        </div>
      </div>
    </div>

    <div class="cards-grid" id="cards-grid" style="margin-top:.9rem"></div>
  </div>
</div>

<!-- Plan setup / edit modal (workout) -->
<div class="overlay" id="setup-overlay">
  <div class="modal">
    <h2 id="setup-title">Set up your plan</h2>
    <div class="field"><label>Plan name</label><input type="text" id="setup-name" value="Plan 1"></div>
    <div class="field-row">
      <div class="field"><label>Start date</label><input type="date" id="setup-start"></div>
      <div class="field"><label>End date</label><input type="date" id="setup-end"></div>
    </div>
    <div id="setup-card-list"></div>
    <button class="add-day-block-btn" id="setup-add-day"><i class="ti ti-plus" style="font-size:13px;vertical-align:-2px;margin-right:5px"></i>Add day</button>
    <div class="hint">Set the exercises, sets, and reps for each day here. You'll only log weight from the cards afterward.</div>
    <div class="modal-actions">
      <button id="setup-delete" style="display:none;color:#c0392b;margin-right:auto">Delete plan</button>
      <button id="setup-cancel">Cancel</button>
      <button class="primary-btn" id="setup-create">Create plan</button>
    </div>
  </div>
</div>

<!-- Block editor modal (routine) -->
<div class="overlay" id="rt-block-overlay">
  <div class="modal" style="max-width:460px">
    <h2 id="rt-block-title">Edit block</h2>
    <div class="field"><label>Name</label><input type="text" id="rt-b-name" placeholder="Meditation + walk"></div>
    <div class="field-row">
      <div class="field"><label>Group</label><select id="rt-b-group" style="width:100%;height:34px"></select></div>
      <div class="field"><label>Type</label><select id="rt-b-type" style="width:100%;height:34px">
        <option value="check">Check off</option>
        <option value="time">Clock time</option>
        <option value="duration">Duration</option>
        <option value="note">Note</option>
      </select></div>
    </div>
    <div class="field" id="rt-b-target-wrap">
      <label id="rt-b-target-label">Target</label>
      <input type="time" id="rt-b-target-time" style="width:100%;height:34px">
      <input type="number" id="rt-b-target-num" min="0" step="1" style="width:100%;height:34px" placeholder="20">
      <div class="hint" id="rt-b-target-hint"></div>
    </div>
    <div class="field">
      <label>Days</label>
      <div class="rt-daypills" id="rt-b-days"></div>
    </div>
    <div class="field" id="rt-b-prompt-wrap"><label>Note prompt</label><input type="text" id="rt-b-prompt" placeholder="Where did you walk?"></div>
    <div class="modal-actions">
      <button id="rt-b-delete" style="display:none;color:#c0392b;margin-right:auto">Delete</button>
      <button id="rt-b-pause" style="display:none">Pause</button>
      <button id="rt-b-cancel">Cancel</button>
      <button class="primary-btn" id="rt-b-save">Save</button>
    </div>
  </div>
</div>

  appId:"1:181288810167:web:1e25b8e2b75ec4d4c8ff32"
};
firebase.initializeApp(firebaseConfig);
const fbAuth=firebase.auth();
const fbDb=firebase.database();
let cloudUser=null,cloudSaveTimer=null,cloudApplyingRemote=false,cloudReady=false;
let rtSaveTimer=null,rtApplyingRemote=false,rtCloudReady=false;
const mySessionId=Math.random().toString(36).slice(2)+Date.now().toString(36);

function setSyncStatus(text,cls){
  const el=document.getElementById('sync-status');
  el.textContent=text;
  el.className='sync-status'+(cls?' '+cls:'');
}

function cloudQueueSave(){
  if(!cloudUser||cloudApplyingRemote)return;
  setSyncStatus('Syncing…','syncing');
  clearTimeout(cloudSaveTimer);
  cloudSaveTimer=setTimeout(()=>{
    const raw=localStorage.getItem(STORAGE_KEY)||'{}';
    const payload=JSON.parse(raw);
    payload._rev={sid:mySessionId,t:Date.now()};
    fbDb.ref('users/'+cloudUser.uid+'/workout').set(payload)
      .then(()=>setSyncStatus('Synced','synced'))
      .catch(()=>setSyncStatus('Sync error','err'));
  },900);
}

function cloudQueueSaveRoutine(){
  if(!cloudUser||rtApplyingRemote)return;
  setSyncStatus('Syncing…','syncing');
  clearTimeout(rtSaveTimer);
  rtSaveTimer=setTimeout(()=>{
    const raw=localStorage.getItem(RT_STORAGE_KEY)||'{}';
    const payload=JSON.parse(raw);
    payload._rev={sid:mySessionId,t:Date.now()};
    fbDb.ref('users/'+cloudUser.uid+'/routine').set(payload)
      .then(()=>setSyncStatus('Synced','synced'))
      .catch(()=>setSyncStatus('Sync error','err'));
  },900);
}

function normalizeWorkoutState(data){
  if(!data||typeof data!=='object')return {plans:[]};
  if(!Array.isArray(data.plans))data.plans=[];
  data.plans.forEach(plan=>{
    if(!Array.isArray(plan.cards))plan.cards=[];
    plan.cards.forEach(card=>{
      if(!Array.isArray(card.exercises))card.exercises=[];
      if(!card.logs||typeof card.logs!=='object')card.logs={};
    });
  });
  return data;
}

function cloudApplyRemote(data){
  cloudApplyingRemote=true;
  try{
    if(data&&data.plans){
      state=normalizeWorkoutState(data);
      localStorage.setItem(STORAGE_KEY,JSON.stringify(state));
      document.getElementById('setup-overlay').classList.remove('open');
      renderAll();
      renderRoutine();
    }
  }finally{
    cloudApplyingRemote=false;
  }
}

function rtCloudApplyRemote(data){
  rtApplyingRemote=true;
  try{
    if(data&&(data.blocks||data.groups)){
      rtState=rtNormalize(data);
      localStorage.setItem(RT_STORAGE_KEY,JSON.stringify(rtState));
      document.getElementById('rt-block-overlay').classList.remove('open');
      renderRoutine();
    }
  }finally{
    rtApplyingRemote=false;
  }
}

function cloudSignIn(){
  const provider=new firebase.auth.GoogleAuthProvider();
  fbAuth.signInWithPopup(provider).catch(()=>setSyncStatus('Sign-in failed','err'));
}
function cloudSignOut(){fbAuth.signOut();}

document.getElementById('sync-btn').onclick=()=>{
  if(cloudUser)cloudSignOut();else cloudSignIn();
};

let cloudInitializedForUid=null;
fbAuth.onAuthStateChanged(user=>{
  cloudUser=user;
  if(user){
    document.getElementById('sync-btn').textContent='Sign out';
    if(cloudInitializedForUid===user.uid)return;
    cloudInitializedForUid=user.uid;
    setSyncStatus('Connecting…','syncing');

    const ref=fbDb.ref('users/'+user.uid+'/workout');
    ref.once('value').then(snap=>{
      const remote=snap.val();
      const localRaw=localStorage.getItem(STORAGE_KEY);
      const local=localRaw?JSON.parse(localRaw):null;
      const remoteTime=(remote&&remote.updatedAt)||0;
      const localTime=(local&&local.updatedAt)||0;
      if(remote&&remote.plans&&remoteTime>=localTime){
        cloudApplyRemote(remote);
      }else{
        cloudQueueSave();
      }
      cloudReady=true;
      setSyncStatus('Synced','synced');
      ref.on('value',snap2=>{
        if(!cloudReady||cloudApplyingRemote)return;
        const remote2=snap2.val();
        if(remote2&&remote2._rev&&remote2._rev.sid===mySessionId)return;
        if(remote2&&remote2.plans)cloudApplyRemote(remote2);
      });
    });

    const rref=fbDb.ref('users/'+user.uid+'/routine');
    rref.once('value').then(snap=>{
      const remote=snap.val();
      const localRaw=localStorage.getItem(RT_STORAGE_KEY);
      const local=localRaw?JSON.parse(localRaw):null;
      const remoteTime=(remote&&remote.updatedAt)||0;
      const localTime=(local&&local.updatedAt)||0;
      if(remote&&(remote.blocks||remote.groups)&&remoteTime>=localTime){
        rtCloudApplyRemote(remote);
      }else{
        rtSaveLocal();
        cloudQueueSaveRoutine();
      }
      rtCloudReady=true;
      rref.on('value',snap2=>{
        if(!rtCloudReady||rtApplyingRemote)return;
        const remote2=snap2.val();
        if(remote2&&remote2._rev&&remote2._rev.sid===mySessionId)return;
        if(remote2&&(remote2.blocks||remote2.groups))rtCloudApplyRemote(remote2);
      });
    });
  }else{
    cloudInitializedForUid=null;
    cloudReady=false;rtCloudReady=false;
    document.getElementById('sync-btn').textContent='Sign in';
    setSyncStatus('Not signed in','');
  }
});
</script>
<script>
const STORAGE_KEY = 'workoutDashboardData_v2';
const BAND_OPTIONS = ['LB','DB'];
function localDateStr(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
const todayStr = () => localDateStr(new Date());
const uid = () => Math.random().toString(36).slice(2,10);

function loadData(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(raw) return JSON.parse(raw);
  }catch(e){ console.error('Failed to load data', e); }
  return { plans: [] };
}
function saveData(){ state.updatedAt=Date.now(); localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); cloudQueueSave(); }

let state = normalizeWorkoutState(loadData());
let currentPlanId = null;
let chartSelectedValue = '__all__';
let visibleChartExercises = new Set();
const CHART_COLORS = ['#0E9488','#3B82F6','#F59E0B','#A855F7','#EF4444','#10B981','#6366F1','#EC4899'];
let cardUiDate = {};
let unlockedCards = new Set();

function getCurrentPlan(){ return state.plans.find(p => p.id === currentPlanId) || null; }
function mostRecentPlanId(){
  if(!state.plans.length) return null;
  return [...state.plans].sort((a,b)=> b.createdAt - a.createdAt)[0].id;
}
function fmtDate(d){
  if(!d) return '';
  return new Date(d+'T00:00:00').toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'});
}
function escapeHtml(s){
  return (s||'').replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}

// ============ PLAN SETUP / EDIT MODAL (shared) ============
const setupOverlay = document.getElementById('setup-overlay');
const setupCardList = document.getElementById('setup-card-list');
let setupState = { cards: [] };
let editingPlanId = null; // null = creating a new plan

function blankSetupCard(i){ return { id:null, name:`Day ${i+1}`, target:16, exercises:[ blankSetupExercise() ] }; }
function blankSetupExercise(){ return { id:null, name:'', sets:3, reps:10, type:'weight' }; }

function renderSetupCards(){
  setupCardList.innerHTML = '';
  setupState.cards.forEach((card, ci)=>{
    const block = document.createElement('div'); block.className='setup-card-block';
    const top = document.createElement('div'); top.className='setup-card-top';
    const nameInp = document.createElement('input'); nameInp.type='text'; nameInp.placeholder='Day name'; nameInp.value=card.name;
    nameInp.addEventListener('input', ()=> card.name = nameInp.value);
    const targetInp = document.createElement('input'); targetInp.type='number'; targetInp.min=0; targetInp.value=card.target; targetInp.title='Target sessions';
    targetInp.addEventListener('input', ()=> card.target = parseInt(targetInp.value)||0);
    const rmDayBtn = document.createElement('button'); rmDayBtn.className='icon-btn'; rmDayBtn.title='Remove this day';
    rmDayBtn.innerHTML = '<i class="ti ti-trash" style="font-size:13px"></i>';
    rmDayBtn.addEventListener('click', ()=>{ setupState.cards.splice(ci,1); renderSetupCards(); });
    top.appendChild(nameInp); top.appendChild(targetInp); top.appendChild(rmDayBtn);
    block.appendChild(top);

    const exList = document.createElement('div');
    card.exercises.forEach((ex, ei)=>{
      const row = document.createElement('div'); row.className='setup-ex-row';
      const exName = document.createElement('input'); exName.type='text'; exName.placeholder='Exercise name'; exName.value=ex.name;
      exName.addEventListener('input', ()=> ex.name = exName.value);
      const setsInp = document.createElement('input'); setsInp.type='number'; setsInp.min=1; setsInp.value=ex.sets; setsInp.title='Sets';
      setsInp.addEventListener('input', ()=> ex.sets = parseInt(setsInp.value)||0);
      const repsInp = document.createElement('input'); repsInp.type='number'; repsInp.min=1; repsInp.value=ex.reps; repsInp.title='Reps';
      repsInp.addEventListener('input', ()=> ex.reps = parseInt(repsInp.value)||0);
      const typeSel = document.createElement('select');
      typeSel.innerHTML = `<option value="weight">Weight</option><option value="band">Band</option>`;
      typeSel.value = ex.type;
      typeSel.addEventListener('change', ()=> ex.type = typeSel.value);
      const rmBtn = document.createElement('button'); rmBtn.className='icon-btn'; rmBtn.title='Remove exercise';
      rmBtn.innerHTML = '<i class="ti ti-x" style="font-size:13px"></i>';
      rmBtn.addEventListener('click', ()=>{ card.exercises.splice(ei,1); renderSetupCards(); });
      row.appendChild(exName); row.appendChild(setsInp); row.appendChild(repsInp); row.appendChild(typeSel); row.appendChild(rmBtn);
      exList.appendChild(row);
    });
    block.appendChild(exList);

    const addExBtn = document.createElement('button'); addExBtn.className='setup-add-ex';
    addExBtn.innerHTML = '<i class="ti ti-plus" style="font-size:12px;vertical-align:-2px;margin-right:3px"></i>Add exercise';
    addExBtn.addEventListener('click', ()=>{ card.exercises.push(blankSetupExercise()); renderSetupCards(); });
    block.appendChild(addExBtn);

    setupCardList.appendChild(block);
  });
}
document.getElementById('setup-add-day').addEventListener('click', ()=>{
  setupState.cards.push(blankSetupCard(setupState.cards.length));
  renderSetupCards();
});

function openCreateModal(){
  editingPlanId = null;
  document.getElementById('setup-title').textContent = 'Set up your plan';
  document.getElementById('setup-create').textContent = 'Create plan';
  document.getElementById('setup-name').value = 'Plan ' + (state.plans.length+1);
  document.getElementById('setup-start').value = todayStr();
  const end = new Date(); end.setMonth(end.getMonth()+2);
  document.getElementById('setup-end').value = localDateStr(end);
  setupState = { cards: [blankSetupCard(0), blankSetupCard(1)] };
  renderSetupCards();
  document.getElementById('setup-delete').style.display = 'none';
  setupOverlay.classList.add('open');
}
function openEditModal(){
  const plan = getCurrentPlan();
  if(!plan) return;
  editingPlanId = plan.id;
  document.getElementById('setup-title').textContent = 'Edit plan';
  document.getElementById('setup-create').textContent = 'Save changes';
  document.getElementById('setup-name').value = plan.name;
  document.getElementById('setup-start').value = plan.startDate;
  document.getElementById('setup-end').value = plan.endDate;
  setupState = { cards: plan.cards.map(c=>({
    id: c.id, name: c.name, target: c.target,
    exercises: c.exercises.map(e=>({ id:e.id, name:e.name, sets:e.sets, reps:e.reps, type:e.type }))
  })) };
  if(!setupState.cards.length) setupState.cards.push(blankSetupCard(0));
  renderSetupCards();
  document.getElementById('setup-delete').style.display = '';
  setupOverlay.classList.add('open');
}
document.getElementById('edit-plan-btn').addEventListener('click', openEditModal);
document.getElementById('setup-cancel').addEventListener('click', ()=>{
  if(state.plans.length) setupOverlay.classList.remove('open');
  else { setupOverlay.classList.remove('open'); switchTab('routine'); }
});
document.getElementById('setup-delete').addEventListener('click', ()=>{
  const plan = state.plans.find(p=>p.id===editingPlanId);
  if(!plan) return;
  if(!confirm(`Delete "${plan.name}"? This will permanently remove its plan and all logged workouts. This cannot be undone.`)) return;
  state.plans = state.plans.filter(p=>p.id!==editingPlanId);
  if(currentPlanId===editingPlanId) currentPlanId = null;
  editingPlanId = null;
  cardUiDate = {}; unlockedCards = new Set();
  saveData();
  setupOverlay.classList.remove('open');
  renderAll();
});
document.getElementById('setup-create').addEventListener('click', ()=>{
  const name = document.getElementById('setup-name').value.trim() || ('Plan ' + (state.plans.length+1));
  const startDate = document.getElementById('setup-start').value || todayStr();
  const endDate = document.getElementById('setup-end').value || startDate;

  const existingCardsById = {};
  if(editingPlanId){
    const existingPlan = state.plans.find(p=>p.id===editingPlanId);
    if(existingPlan) existingPlan.cards.forEach(c=> existingCardsById[c.id]=c);
  }

  const cards = setupState.cards.map(c=>{
    const cardId = c.id || uid();
    const existingCard = c.id ? existingCardsById[c.id] : null;
    const logs = existingCard ? existingCard.logs : {};
    return {
      id: cardId,
      name: c.name.trim() || 'Day',
      target: Math.max(0, c.target||0),
      exercises: c.exercises.filter(e=>e.name.trim()!=='').map(e=>({
        id: e.id || uid(), name: e.name.trim(), sets: Math.max(0,e.sets||0), reps: Math.max(0,e.reps||0), type: e.type
      })),
      logs
    };
  });

  if(editingPlanId){
    const plan = state.plans.find(p=>p.id===editingPlanId);
    plan.name = name; plan.startDate = startDate; plan.endDate = endDate; plan.cards = cards;
    currentPlanId = plan.id;
  } else {
    const plan = { id: uid(), name, startDate, endDate, createdAt: Date.now(), cards };
    state.plans.push(plan);
    currentPlanId = plan.id;
  }
  cardUiDate = {}; unlockedCards = new Set();
  saveData();
  setupOverlay.classList.remove('open');
  renderAll();
});

// ============ PLAN SELECTOR ============
const planSelect = document.getElementById('plan-select');
planSelect.addEventListener('change', ()=>{
  if(planSelect.value === '__new__'){
    planSelect.value = currentPlanId;
    openCreateModal();
    return;
  }
  currentPlanId = planSelect.value;
  cardUiDate = {}; unlockedCards = new Set();
  renderAll();
});

function renderPlanBar(){
  const bar = document.getElementById('plan-bar');
  if(!state.plans.length){ bar.style.display='none'; return; }
  bar.style.display='flex';
  const sorted = [...state.plans].sort((a,b)=> b.createdAt - a.createdAt);
  planSelect.innerHTML = sorted.map(p=>`<option value="${p.id}">${escapeHtml(p.name)} · ${fmtDate(p.startDate)}–${fmtDate(p.endDate)}</option>`).join('')
    + `<option value="__new__">+ New plan…</option>`;
  planSelect.value = currentPlanId;
}

// ============ DAY CARDS ============
const cardsGrid = document.getElementById('cards-grid');

function latestLoggedValues(card){
  const dates = Object.keys(card.logs).sort();
  if(!dates.length) return null;
  return card.logs[dates[dates.length-1]];
}
function defaultDateForCard(card){
  const dates = Object.keys(card.logs).sort();
  return dates.length ? dates[dates.length-1] : todayStr();
}

function renderCards(){
  cardsGrid.innerHTML='';
  const plan = getCurrentPlan();
  if(!plan) return;
  plan.cards.forEach(card=>{
    if(!(card.id in cardUiDate)) cardUiDate[card.id] = defaultDateForCard(card);
    cardsGrid.appendChild(makeCardEl(plan, card));
  });
}

function makeStepper(kind, startVal, disabled, exId){
  const wrap = document.createElement('div'); wrap.className='stepper';
  const minus = document.createElement('button'); minus.type='button'; minus.textContent='−';
  const box = document.createElement('input'); box.type='text'; box.readOnly=true; box.dataset.ex = exId;
  const plus = document.createElement('button'); plus.type='button'; plus.textContent='+';
  minus.disabled = disabled; plus.disabled = disabled; box.disabled = disabled;

  if(kind==='weight'){
    let val = Math.max(0, Math.min(140, parseInt(startVal)||0));
    box.value = val;
    minus.addEventListener('click', ()=>{ val = Math.max(0, val-10); box.value = val; });
    plus.addEventListener('click', ()=>{ val = Math.min(140, val+10); box.value = val; });
  } else {
    let idx = Math.max(0, BAND_OPTIONS.indexOf(startVal));
    box.value = BAND_OPTIONS[idx];
    minus.addEventListener('click', ()=>{ idx = Math.max(0, idx-1); box.value = BAND_OPTIONS[idx]; });
    plus.addEventListener('click', ()=>{ idx = Math.min(BAND_OPTIONS.length-1, idx+1); box.value = BAND_OPTIONS[idx]; });
  }
  wrap.appendChild(minus); wrap.appendChild(box); wrap.appendChild(plus);
  return wrap;
}

function makeCardEl(plan, card){
  const el = document.createElement('div'); el.className='card';
  const date = cardUiDate[card.id];
  const existingLog = card.logs[date];
  const isUnlocked = unlockedCards.has(card.id);
  const isLoggedView = !!existingLog && !isUnlocked;

  const hdr = document.createElement('div'); hdr.className='day-card-hdr';
  const nameLabel = document.createElement('div');
  nameLabel.className='day-name-label'; nameLabel.textContent = card.name; nameLabel.title = card.name;
  hdr.appendChild(nameLabel);
  el.appendChild(hdr);

  const dateRow = document.createElement('div'); dateRow.className='date-row';
  const calIcon = document.createElement('i'); calIcon.className='ti ti-calendar'; calIcon.style.cssText='font-size:14px;color:var(--tm)';
  const dateInput = document.createElement('input'); dateInput.type='date'; dateInput.value=date;
  dateInput.addEventListener('change', ()=>{
    cardUiDate[card.id] = dateInput.value;
    unlockedCards.delete(card.id);
    renderCards();
  });
  const logBtn = document.createElement('button'); logBtn.className='log-btn' + (isLoggedView ? ' is-logged' : '');
  logBtn.textContent = isLoggedView ? 'Logged' : 'Log';
  logBtn.addEventListener('click', ()=>{
    if(isLoggedView){
      delete card.logs[date];
      unlockedCards.delete(card.id);
      saveData();
      renderAll();
      return;
    }
    const snapshot = {};
    card.exercises.forEach(ex=>{
      const fieldEl = el.querySelector(`[data-ex="${ex.id}"]`);
      snapshot[ex.id] = fieldEl ? fieldEl.value : '';
    });
    card.logs[date] = snapshot;
    unlockedCards.delete(card.id);
    saveData();
    renderAll();
  });
  dateRow.appendChild(calIcon); dateRow.appendChild(dateInput); dateRow.appendChild(logBtn);
  el.appendChild(dateRow);

  if(!card.exercises.length){
    const hint = document.createElement('div'); hint.className='empty-hint';
    hint.textContent = 'No exercises defined for this day — edit the plan to add some.';
    el.appendChild(hint);
    return el;
  }

  const colHdr=document.createElement('div'); colHdr.className='col-hdr';
  colHdr.innerHTML='<span style="text-align:center">Sets</span><span style="text-align:center">Reps</span><span></span><span style="text-align:right">Wt</span>';
  el.appendChild(colHdr);

  const defaults = existingLog || latestLoggedValues(card) || {};
  const rows = document.createElement('div');
  card.exercises.forEach(ex=>{
    const row = document.createElement('div'); row.className='ex-row';
    const setsSpan = document.createElement('span'); setsSpan.className='static-val'; setsSpan.textContent = ex.sets;
    const repsSpan = document.createElement('span'); repsSpan.className='static-val'; repsSpan.textContent = ex.reps;
    const nameSpan = document.createElement('span'); nameSpan.className='static-name'; nameSpan.textContent = ex.name; nameSpan.title = ex.name;

    const startVal = existingLog ? (existingLog[ex.id] ?? '') : (defaults[ex.id] ?? (ex.type==='band' ? BAND_OPTIONS[0] : 10));
    const field = makeStepper(ex.type, startVal, isLoggedView, ex.id);

    row.appendChild(setsSpan); row.appendChild(repsSpan); row.appendChild(nameSpan); row.appendChild(field);
    rows.appendChild(row);
  });
  el.appendChild(rows);
  return el;
}

// ============ INSIGHTS ============
function planDurationDays(plan){
  const start = new Date(plan.startDate+'T00:00:00');
  const end = new Date(plan.endDate+'T00:00:00');
  return Math.max(1, Math.round((end-start)/86400000)+1);
}

function renderInsights(){
  const plan = getCurrentPlan();
  const barsEl = document.getElementById('progress-bars');
  const motivateEl = document.getElementById('motivate-text');
  const chartSelect = document.getElementById('chart-select');
  const chartBox = document.getElementById('chart-box');
  const legendEl = document.getElementById('chart-legend');

  if(!plan || !plan.cards.length){
    barsEl.innerHTML=''; motivateEl.textContent='Set up a plan with day cards to start tracking.';
    chartSelect.innerHTML='';
    chartBox.innerHTML='pick a workout day to see progress';
    legendEl.innerHTML='';
    return;
  }

  const totalDays = planDurationDays(plan);

  barsEl.innerHTML='';
  plan.cards.forEach(card=>{
    const count = Object.keys(card.logs).length;
    const target = card.target;
    const pct = target>0 ? Math.min(100, Math.round(count/target*100)) : 0;
    const wrap=document.createElement('div');
    wrap.innerHTML = `<div class="prog-label"><span>${escapeHtml(card.name)}</span><span style="color:var(--tm)">${count} / ${target}</span></div>
      <div class="prog-track"><div class="prog-fill" style="width:${pct}%"></div></div>`;
    barsEl.appendChild(wrap);
  });

  const totalLoggedAllTime = plan.cards.reduce((s,c)=>s+Object.keys(c.logs).length,0);
  const totalTargetAllTime = plan.cards.reduce((s,c)=>s+c.target,0);
  const now = new Date();
  const end = new Date(plan.endDate+'T00:00:00');
  const daysRemaining = Math.max(0, Math.round((end-now)/86400000));
  const remainingSessions = Math.max(0, totalTargetAllTime - totalLoggedAllTime);
  const weeksRemaining = Math.max(1, Math.round(daysRemaining/7));
  const pace = Math.ceil(remainingSessions / weeksRemaining);

  if(totalLoggedAllTime===0){
    motivateEl.textContent = `Your plan runs ${totalDays} days — hit Log on a card once you finish a session to start tracking.`;
  } else if(daysRemaining<=0){
    motivateEl.textContent = `Your plan window has ended — nice work either way.`;
  } else {
    motivateEl.textContent = `${daysRemaining} days left — ${pace} session${pace===1?'':'s'}/week keeps you on pace for your goal.`;
  }

  const months = planMonths(plan);
  const prevSelected = chartSelectedValue;
  const monthValue = m => `__month__${m.year}-${String(m.month+1).padStart(2,'0')}`;
  let monthOptionsHtml, validMonthValues;
  if(months.length<=1){
    monthOptionsHtml = `<option value="__all__">${escapeHtml(plan.name)}</option>`;
    validMonthValues = ['__all__'];
  } else {
    monthOptionsHtml = months.map(m=>{
      const label = new Date(m.year, m.month, 1).toLocaleDateString('en-US',{month:'short',year:'numeric'});
      return `<option value="${monthValue(m)}">${escapeHtml(plan.name)} · ${label}</option>`;
    }).join('');
    validMonthValues = months.map(monthValue);
  }
  chartSelect.innerHTML = monthOptionsHtml + plan.cards.map(c=>`<option value="${c.id}">${escapeHtml(c.name)}</option>`).join('');

  const validValues = new Set([...validMonthValues, ...plan.cards.map(c=>c.id)]);
  chartSelectedValue = validValues.has(prevSelected) ? prevSelected : validMonthValues[0];
  chartSelect.value = chartSelectedValue;

  renderChartPanel(plan);
}

document.getElementById('chart-select').addEventListener('change', ()=>{
  chartSelectedValue = document.getElementById('chart-select').value;
  visibleChartExercises = new Set();
  const plan = getCurrentPlan();
  if(plan) renderChartPanel(plan);
});

function planMonths(plan){
  const start = new Date(plan.startDate+'T00:00:00');
  const end = new Date(plan.endDate+'T00:00:00');
  const months = [];
  const cur = new Date(start.getFullYear(), start.getMonth(), 1);
  const endMonth = new Date(end.getFullYear(), end.getMonth(), 1);
  while(cur<=endMonth){
    months.push({ year: cur.getFullYear(), month: cur.getMonth() });
    cur.setMonth(cur.getMonth()+1);
  }
  return months;
}

function renderChartPanel(plan){
  const legendEl = document.getElementById('chart-legend');
  if(chartSelectedValue === '__all__'){
    drawMonthCalendar(plan, new Date(plan.startDate+'T00:00:00'));
    return;
  }
  if(chartSelectedValue.indexOf('__month__')===0){
    const [y,m] = chartSelectedValue.replace('__month__','').split('-').map(Number);
    drawMonthCalendar(plan, new Date(y, m-1, 1));
    return;
  }
  const card = plan.cards.find(c=>c.id===chartSelectedValue);
  if(!card){ legendEl.innerHTML=''; drawMonthCalendar(plan, new Date(plan.startDate+'T00:00:00')); return; }
  drawDayChart(card);
}

function toDateStr(d){ return localDateStr(d); }

function drawMonthCalendar(plan, monthDate){
  const box = document.getElementById('chart-box');
  const legendEl = document.getElementById('chart-legend');
  legendEl.innerHTML = '';

  if(!plan.cards.length){
    box.innerHTML = 'set up day cards to start tracking';
    return;
  }

  const loggedDates = new Set();
  plan.cards.forEach(card=>{
    Object.keys(card.logs).forEach(d=> loggedDates.add(d));
  });

  const planStart = new Date(plan.startDate+'T00:00:00');
  const planEnd = new Date(plan.endDate+'T00:00:00');

  const year = monthDate.getFullYear(), month = monthDate.getMonth();
  const firstOfMonth = new Date(year, month, 1);
  const daysInMonth = new Date(year, month+1, 0).getDate();
  const lead = firstOfMonth.getDay();

  const cells = [];
  for(let i=0;i<42;i++){
    const dayNum = i - lead + 1;
    cells.push(dayNum>=1 && dayNum<=daysInMonth ? new Date(year, month, dayNum) : null);
  }

  const cellHtml = cells.map(d=>{
    if(!d) return `<div class="cal-cell empty"></div>`;
    const key = toDateStr(d);
    const filled = loggedDates.has(key);
    const outOfRange = d<planStart || d>planEnd;
    const title = fmtDate(key);
    return `<div class="cal-cell${filled?' filled':''}${outOfRange?' out-of-range':''}" title="${escapeHtml(title)}">${d.getDate()}</div>`;
  }).join('');

  const dowHtml = ['S','M','T','W','T','F','S'].map(l=>`<div class="cal-dow">${l}</div>`).join('');
  box.innerHTML = `<div class="cal-wrap">
    <div class="cal-dow-row">${dowHtml}</div>
    <div class="cal-weeks">${cellHtml}</div>
  </div>`;
}

function niceTicks(min, max, count){
  if(min===max) return [min];
  const ticks=[];
  for(let i=0;i<count;i++) ticks.push(Math.round((min + (max-min)*i/(count-1))*10)/10);
  return [...new Set(ticks)];
}

function drawDayChart(card){
  const box = document.getElementById('chart-box');
  const legendEl = document.getElementById('chart-legend');

  if(!card.exercises.length){
    box.innerHTML = 'no exercises defined for this day';
    legendEl.innerHTML = '';
    return;
  }
  const dates = Object.keys(card.logs).sort();
  if(!dates.length){
    box.innerHTML = 'no sessions logged yet for this day';
    legendEl.innerHTML = '';
    return;
  }

  const series = card.exercises.map((ex,i)=>{
    const points = dates.map(d=>{
      const raw = card.logs[d][ex.id];
      let val = null;
      if(raw!==undefined && raw!==''){
        val = ex.type==='band' ? (raw==='LB'?10 : raw==='DB'?20 : NaN) : parseFloat(raw);
        if(isNaN(val) || val<0) val = null;
      }
      return { date: d, val };
    }).filter(p=>p.val!==null);
    return { id: ex.id, name: ex.name, color: CHART_COLORS[i % CHART_COLORS.length], points };
  });

  legendEl.innerHTML = series.map(s=>
    `<button type="button" class="legend-item${visibleChartExercises.has(s.id)?'':' off'}" data-ex="${s.id}"><span class="dot" style="background:${s.color}"></span>${escapeHtml(s.name)}</button>`
  ).join('');
  legendEl.querySelectorAll('.legend-item').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const id = btn.dataset.ex;
      if(visibleChartExercises.has(id)) visibleChartExercises.delete(id); else visibleChartExercises.add(id);
      const plan = getCurrentPlan();
      if(plan) renderChartPanel(plan);
    });
  });

  const visibleSeries = series.filter(s=> visibleChartExercises.has(s.id) && s.points.length);
  if(!visibleSeries.length){
    box.innerHTML = series.some(s=>s.points.length) ? 'click a legend item to show its curve' : 'no numeric history yet for this day';
    return;
  }

  const w=280,h=110,padL=26,padR=10,padT=8,padB=18;
  const plotW = w-padL-padR, plotH = h-padT-padB;
  const stepX = dates.length>1 ? plotW/(dates.length-1) : 0;
  const xFor = i => padL + i*stepX;

  const allVals = visibleSeries.flatMap(s=>s.points.map(p=>p.val));
  const min = Math.min(...allVals), max = Math.max(...allVals);
  const range = (max-min)||1;
  const yFor = v => padT + plotH - ((v-min)/range)*plotH;
  const ticks = niceTicks(min, max, 4);

  const gridlines = ticks.map(t=>{
    const y = yFor(t);
    return `<line x1="${padL}" y1="${y.toFixed(1)}" x2="${w-padR}" y2="${y.toFixed(1)}" stroke="var(--bd)" stroke-width="1"/>
      <text x="${padL-4}" y="${(y+3).toFixed(1)}" font-size="8" fill="#8A9592" text-anchor="end">${t}</text>`;
  }).join('');

  const paths = visibleSeries.map(s=>{
    const coords = s.points.map(p=> [xFor(dates.indexOf(p.date)), yFor(p.val)]);
    const path = coords.map((c,i)=>(i===0?'M':'L')+c[0].toFixed(1)+','+c[1].toFixed(1)).join(' ');
    const dots = coords.map(c=>`<circle cx="${c[0].toFixed(1)}" cy="${c[1].toFixed(1)}" r="2.5" fill="${s.color}"/>`).join('');
    return `<path d="${path}" fill="none" stroke="${s.color}" stroke-width="2"/>${dots}`;
  }).join('');

  box.innerHTML = `<svg viewBox="0 0 ${w} ${h}" style="width:100%;max-width:320px" role="img" aria-label="Progress chart">
    ${gridlines}
    ${paths}
    <text x="${padL}" y="${h-4}" font-size="9" fill="#8A9592">1</text>
    <text x="${w-padR}" y="${h-4}" font-size="9" fill="#8A9592" text-anchor="end">${dates.length}</text>
  </svg>`;
}

// ============ EXPORT (Ctrl/Cmd+E) ============
function exportData(){
  const payload = { workout: state, routine: rtState };
  const blob = new Blob([JSON.stringify(payload, null, 2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = `dashboard-backup-${todayStr()}.json`;
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
}
document.addEventListener('keydown', e=>{
  if((e.ctrlKey||e.metaKey) && e.key.toLowerCase()==='e'){ e.preventDefault(); exportData(); }
});

// ============ WORKOUT RENDER ============
function renderAll(){
  if(!state.plans.length){
    document.getElementById('plan-bar').style.display='none';
    cardsGrid.innerHTML='';
    renderInsights();
    if(activeTab==='workout') openCreateModal();

    return;
  }
  if(!currentPlanId || !getCurrentPlan()) currentPlanId = mostRecentPlanId();
  renderPlanBar();
  renderCards();

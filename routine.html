function rtBuckets(){
  const today = todayStr();
  const out = [];
  if(rtGran==='daily'){
    for(let i=27;i>=0;i--){
      const d = rtShift(today,-i);
      out.push({ label: String(new Date(d+'T00:00:00').getDate()), dates:[d], key:d });
    }
  } else if(rtGran==='weekly'){
    let end = today;
    const endDow = rtDow(end);
    let weekStart = rtShift(end, -endDow);
    const starts = [];
    for(let i=7;i>=0;i--) starts.push(rtShift(weekStart, -7*i));
    starts.forEach(s=>{
      const dates=[];
      for(let i=0;i<7;i++){ const d=rtShift(s,i); if(d<=today) dates.push(d); }
      const dd = new Date(s+'T00:00:00');
      out.push({ label: (dd.getMonth()+1)+'/'+dd.getDate(), dates, key:s });
    });
  } else {
    const now = new Date(today+'T00:00:00');
    for(let i=5;i>=0;i--){
      const m = new Date(now.getFullYear(), now.getMonth()-i, 1);
      const days = new Date(m.getFullYear(), m.getMonth()+1, 0).getDate();
      const dates=[];
      for(let dnum=1; dnum<=days; dnum++){
        const d = toDateStr(new Date(m.getFullYear(), m.getMonth(), dnum));
        if(d<=today) dates.push(d);
      }
      out.push({ label: m.toLocaleDateString('en-US',{month:'short'}), dates, key: m.getFullYear()+'-'+(m.getMonth()+1) });
    }
  }
  return out;
}

function rtBucketPct(block, bucket){
  let done=0, considered=0;
  bucket.dates.forEach(d=>{
    const s = rtStatus(block, d);
    if(s==='done'){ done++; considered++; }
    else if(s==='missed'){ considered++; }
  });
  if(!considered) return null;
  return Math.round(done/considered*100);
}
function rtBucketValue(block, bucket){
  if(block.type==='duration'){
    const vals = bucket.dates.map(d=>{ const e=rtEntry(d,block.id); return (e&&typeof e.minutes==='number'&&e.minutes>0)?e.minutes:null; }).filter(v=>v!==null);
    if(!vals.length) return null;
    return Math.round(vals.reduce((a,b)=>a+b,0)/vals.length);
  }
  if(block.type==='time'){
    const vals = bucket.dates.map(d=>{ const e=rtEntry(d,block.id); return (e&&e.time)?rtToMin(e.time):null; }).filter(v=>v!==null);
    if(!vals.length) return null;
    return Math.round(vals.reduce((a,b)=>a+b,0)/vals.length);
  }
  return rtBucketPct(block, bucket);
}

function rtWeakestDow(){
  const tally = [0,1,2,3,4,5,6].map(()=>({done:0,total:0}));
  Object.keys(rtState.log).forEach(()=>{});
  const today = todayStr();
  for(let i=0;i<90;i++){
    const d = rtShift(today,-i);
    rtState.blocks.forEach(b=>{
      const s = rtStatus(b,d);
      if(s==='done'){ tally[rtDow(d)].done++; tally[rtDow(d)].total++; }
      else if(s==='missed'){ tally[rtDow(d)].total++; }
    });
  }
  let worst=null, worstPct=101;
  tally.forEach((t,i)=>{
    if(t.total<3) return;
    const p = t.done/t.total*100;
    if(p<worstPct){ worstPct=p; worst=i; }
  });
  return worst===null ? '—' : RT_DOW_FULL[worst].slice(0,3);
}

function rtRenderStats(){
  const buckets = rtBuckets();
  document.getElementById('rt-range-label').textContent =
    rtGran==='daily' ? 'Last 28 days' : rtGran==='weekly' ? 'Last 8 weeks' : 'Last 6 months';

  const allDates = buckets.flatMap(b=>b.dates);
  let done=0, considered=0;
  rtState.blocks.forEach(b=> allDates.forEach(d=>{
    const s = rtStatus(b,d);
    if(s==='done'){ done++; considered++; } else if(s==='missed'){ considered++; }
  }));
  const overall = considered ? Math.round(done/considered*100) : 0;

  const sleeps = allDates.map(rtSleepFor).filter(v=>v!==null);
  const avgSleep = sleeps.length ? rtFmtDur(sleeps.reduce((a,b)=>a+b,0)/sleeps.length) : '—';
  const wakeB = rtState.blocks.find(b=>b.role==='wake');
  let avgWake = '—';
  if(wakeB){
    const ws = allDates.map(d=>{ const e=rtEntry(d,wakeB.id); return (e&&e.time)?rtToMin(e.time):null; }).filter(v=>v!==null);
    if(ws.length) avgWake = rtFromMin(ws.reduce((a,b)=>a+b,0)/ws.length);
  }

  document.getElementById('rt-stat-metrics').innerHTML = [
    ['Overall', overall+'%'],
    ['Avg sleep', avgSleep],
    ['Avg wake', avgWake],
    ['Weakest day', rtWeakestDow()]
  ].map(([l,v])=>`<div class="rt-metric"><div class="l">${l}</div><div class="v">${escapeHtml(String(v))}</div></div>`).join('');

  const cols = `150px repeat(${buckets.length}, minmax(0,1fr)) 46px`;
  const mx = document.getElementById('rt-matrix');
  mx.innerHTML = '';

  const head = document.createElement('div');
  head.className='rt-mx-head'; head.style.gridTemplateColumns = cols;
  head.innerHTML = '<span></span>' + buckets.map(b=>`<span class="rt-mx-tick">${escapeHtml(b.label)}</span>`).join('') + '<span></span>';
  mx.appendChild(head);

  if(!rtState.blocks.length){
    const p=document.createElement('div'); p.className='empty-hint';
    p.textContent='No routine blocks yet — add some on the Today tab.';
    mx.appendChild(p);
    return;
  }

  rtState.blocks.forEach(block=>{
    const row = document.createElement('div');
    row.className='rt-mx-row'; row.style.gridTemplateColumns = cols;

    const lbl = document.createElement('button');
    lbl.className='rt-mx-label'; lbl.textContent = block.name; lbl.title = block.name;
    lbl.addEventListener('click', ()=>{
      rtOpenDetail = (rtOpenDetail===block.id) ? null : block.id;
      rtRenderStats();
    });
    row.appendChild(lbl);

    let tDone=0, tCons=0;
    buckets.forEach(b=>{
      const pct = rtBucketPct(block,b);
      const cell = document.createElement('div');
      if(pct===null){ cell.className='rt-mx-cell na'; }
      else{
        cell.className='rt-mx-cell' + (pct>0?' f':'');
        if(pct>0) cell.style.opacity = Math.max(0.18, pct/100).toFixed(2);
        cell.title = b.label + ' · ' + pct + '%';
      }
      b.dates.forEach(d=>{
        const s = rtStatus(block,d);
        if(s==='done'){ tDone++; tCons++; } else if(s==='missed'){ tCons++; }
      });
      row.appendChild(cell);
    });

    const pctEl = document.createElement('span');
    pctEl.className='rt-mx-pct';
    pctEl.textContent = tCons ? Math.round(tDone/tCons*100)+'%' : '—';
    row.appendChild(pctEl);

    mx.appendChild(row);

    if(rtOpenDetail===block.id){
      const det = document.createElement('div');
      det.className='rt-detail';
      det.innerHTML = rtDetailChart(block, buckets);
      mx.appendChild(det);
    }
  });
}

function rtDetailChart(block, buckets){
  const vals = buckets.map(b=> rtBucketValue(block,b));
  const present = vals.filter(v=>v!==null);
  if(!present.length) return '<div style="font-size:12px;color:var(--tm)">No data logged for this block yet.</div>';

  const isTime = block.type==='time';
  const isDur = block.type==='duration';
  const unit = isTime ? '' : isDur ? ' min' : '%';
  const fmt = v => isTime ? rtFromMin(v) : (Math.round(v)+unit);

  let min = Math.min(...present), max = Math.max(...present);
  if(!isTime && !isDur){ min = 0; max = 100; }
  if(min===max){ min = Math.max(0,min-10); max = max+10; }

  const targetVal = isTime && block.target ? rtToMin(block.target) : (isDur && block.target ? block.target : null);
  if(targetVal!==null){ min = Math.min(min,targetVal); max = Math.max(max,targetVal); }

  const w=560,h=130,padL=42,padR=10,padT=10,padB=20;
  const plotW=w-padL-padR, plotH=h-padT-padB;
  const stepX = buckets.length>1 ? plotW/(buckets.length-1) : 0;
  const range = (max-min)||1;
  const xFor = i => padL + i*stepX;
  const yFor = v => padT + plotH - ((v-min)/range)*plotH;

  const ticks = [min, min+range/2, max];
  const grid = ticks.map(t=>{
    const y=yFor(t);
    return `<line x1="${padL}" y1="${y.toFixed(1)}" x2="${w-padR}" y2="${y.toFixed(1)}" stroke="#DFE4E2" stroke-width="1"/>
      <text x="${padL-5}" y="${(y+3).toFixed(1)}" font-size="9" fill="#8A9592" text-anchor="end">${fmt(t)}</text>`;
  }).join('');

  const targetLine = targetVal!==null
    ? `<line x1="${padL}" y1="${yFor(targetVal).toFixed(1)}" x2="${w-padR}" y2="${yFor(targetVal).toFixed(1)}" stroke="#0E9488" stroke-width="1" stroke-dasharray="4 3" opacity="0.7"/>`
    : '';

  const segs=[]; let cur=[];
  vals.forEach((v,i)=>{
    if(v===null){ if(cur.length){segs.push(cur);cur=[];} return; }
    cur.push([xFor(i), yFor(v)]);
  });
  if(cur.length) segs.push(cur);

  const lines = segs.map(sg=>{
    const path = sg.map((c,i)=>(i===0?'M':'L')+c[0].toFixed(1)+','+c[1].toFixed(1)).join(' ');
    return `<path d="${path}" fill="none" stroke="#0E9488" stroke-width="2"/>`;
  }).join('');
  const dots = segs.flat().map(c=>`<circle cx="${c[0].toFixed(1)}" cy="${c[1].toFixed(1)}" r="2.5" fill="#0E9488"/>`).join('');

  const caption = isTime ? 'average clock time' : isDur ? 'average minutes per session' : 'completion rate';
  return `<div style="font-size:11px;color:var(--tm);margin-bottom:6px">${escapeHtml(block.name)} · ${caption}${targetVal!==null?' · dashed line is your target':''}</div>
  <svg viewBox="0 0 ${w} ${h}" style="width:100%" role="img" aria-label="${escapeHtml(block.name)} trend">
    ${grid}${targetLine}${lines}${dots}
    <text x="${padL}" y="${h-4}" font-size="9" fill="#8A9592">${escapeHtml(buckets[0].label)}</text>
    <text x="${w-padR}" y="${h-4}" font-size="9" fill="#8A9592" text-anchor="end">${escapeHtml(buckets[buckets.length-1].label)}</text>
  </svg>`;
}

function rtRenderAll(){
  if(rtSub==='today') rtRenderToday(); else rtRenderStats();
}

currentPlanId = mostRecentPlanId();
